<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>SVNAssist Spike</title>
<style>
:root{--bg:#fff;--fg:#000;--bd:#ccc;--btn:#eee;--btnfg:#000;--sel:#cde;--selfg:#000;--link:#06c;--font:'Segoe UI';--fs:12px}
html,body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs) var(--font)}
body{padding:12px}
button{background:var(--btn);color:var(--btnfg);border:1px solid var(--bd);padding:4px 12px;font:inherit}
.sw{display:inline-block;width:70px;height:34px;border:1px solid var(--bd);margin:2px;font-size:10px;vertical-align:top}
pre{border:1px solid var(--bd);padding:6px;min-height:60px;white-space:pre-wrap}
a{color:var(--link)} li.sel{background:var(--sel);color:var(--selfg)}
</style></head><body>
<h3>SVNAssist WebView2 spike</h3>
<p id="kind">tema: (in attesa dell'host)</p>
<div id="sw"></div>
<p><button id="go">Round-trip JS &rarr; host &rarr; backend &rarr; host &rarr; JS</button></p>
<pre id="out"></pre>
<p>Tastiera: clicca qui e premi Del, Ctrl+A, frecce, Tab. <input id="inp" value="testo"> <a href="#">link</a></p>
<ul tabindex="0" id="list"><li>riga 1</li><li class="sel">riga 2 (selezionata)</li><li>riga 3</li></ul>
<pre id="keys"></pre>
<script>
const out=document.getElementById('out'), keys=document.getElementById('keys');
const post=m=>window.chrome.webview.postMessage(m);
let n=0;
function go(){post({type:'echo',id:++n,text:'ciao '+n});}
document.getElementById('go').onclick=go;
window.chrome.webview.addEventListener('message',e=>{
  const m=e.data;
  if(m.type==='theme'){
    for(const [k,v] of Object.entries(m.vars)) document.documentElement.style.setProperty(k,v);
    document.getElementById('kind').textContent='tema: '+m.kind;
    document.getElementById('sw').innerHTML=Object.entries(m.vars).filter(([k,v])=>/^#/.test(v)).map(([k,v])=>`<span class="sw" style="background:${v}">${k}</span>`).join('');
  } else if(m.type==='reply'){
    out.textContent+=(m.ok?'OK ':'ERR ')+m.result+'\n';
    post({type:'done',result:m.result});
  }
});
document.addEventListener('keydown',e=>{keys.textContent=`keydown ${e.ctrlKey?'Ctrl+':''}${e.key}\n`+keys.textContent.slice(0,400);});
post({type:'ready'});
if(location.search.includes('auto=1')) go();
</script></body></html>
