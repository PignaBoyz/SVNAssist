name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # I test di integrazione usano svn.exe (repository temporanei file://).
      - name: Installa svn
        shell: pwsh
        run: |
          choco install sliksvn -y --no-progress
          $svnDir = 'C:\Program Files\SlikSvn\bin'
          if (-not (Test-Path "$svnDir\svn.exe")) { throw "svn.exe non trovato in $svnDir" }
          $svnDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$svnDir\svn.exe" --version --quiet

      - uses: microsoft/setup-msbuild@v2

      - name: Build e publish backend
        run: |
          dotnet build tests/SVNAssist.Tests/SVNAssist.Tests.csproj -c Release
          dotnet publish src/SVNAssist.Backend -c Release -o src/SVNAssist.Backend/bin/publish

      - name: Build VSIX (host in-proc net472)
        shell: pwsh
        run: |
          dotnet restore src/SVNAssist.Host
          msbuild src/SVNAssist.Host/SVNAssist.Host.csproj -p:Configuration=Release -v:m
          if (-not (Get-ChildItem src/SVNAssist.Host/bin/Release -Recurse -Filter *.vsix)) { throw 'VSIX non prodotto' }

      - name: Test
        run: dotnet test tests/SVNAssist.Tests/SVNAssist.Tests.csproj -c Release --no-build

      - name: Test UI web
        run: node --test "tests/ui-web/*.test.mjs"

      # Backend pubblicato (framework-dependent): lo includera' il VSIX dell'host.
      - name: Publish backend
        run: dotnet publish src/SVNAssist.Backend/SVNAssist.Backend.csproj -c Release -o out/backend --no-build

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: SVNAssist-vsix
          path: src/SVNAssist.Host/bin/Release/**/*.vsix
          if-no-files-found: error

      # TODO integrazione host: il VSIX lo produrra' src/SVNAssist.Host (msbuild, vedi spike/); src/SVNAssist e' stato rimosso.
      # - name: Upload VSIX
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: SVNAssist-vsix
      #     path: src/SVNAssist.Host/bin/Release/**/*.vsix
      #     if-no-files-found: error
