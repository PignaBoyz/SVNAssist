<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVNAssist - Demo interattiva</title>
<style>
/* Variabili del tema. Unico posto in cui compaiono colori fissi.
   Il tema "Auto" e' fornito dall'host (VS) con messaggio {type:"theme",kind,vars}: sovrascrive queste variabili. */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg0:#181818; --bg1:#1f1f1f; --bg2:#252526; --bg3:#2d2d30; --bg4:#33333a; --bd:#3f3f46; --bd2:#6b6b75;
  --fg:#e6e6e6; --fg2:#b8b8b8; --fg3:#a4a4a4;
  --acc:#0e63b0; --acc-fg:#ffffff; --acc-h:#1473c9; --acc2:#6cb6ff; --acc-bg:#04395e; --focus:#6cb6ff;
  --ok:#4ec9b0; --warn:#e5b84b; --err:#ff8f7a;
  --st-M:#79a8f5; --st-A:#4fc47f; --st-D:#f59a9a; --st-C:#ff93a4; --st-U:#b0b0b0; --st-X:#ffa53a; --st-R:#b99af0;
  --add-bg:#12331c; --add-fg:#a8ecb5; --add-hl:#1a5c2e; --del-bg:#3b1519; --del-fg:#ffb8b3; --del-hl:#7a2a30;
  --hunk-bg:#13263d; --hunk-fg:#8fc2ff; --empty-bg:#202024;
  --syn-kw:#7cb7ff; --syn-str:#e8a87c; --syn-cm:#8fb98f; --syn-num:#b5cea8; --syn-ty:#4ec9b0;
  --chip-ok-bg:#12372d; --chip-ok-fg:#8be3c7; --chip-fail-bg:#3d1d17; --chip-fail-fg:#ffb3a3; --chip-run-bg:#10324f; --chip-run-fg:#9fd0ff;
  --warn-bg:#4a3500; --warn-fg:#ffd98a;
  --shadow:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif; --mono:Consolas,"Cascadia Mono","Courier New",monospace; --fs:13px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg0:#ffffff; --bg1:#ffffff; --bg2:#f3f3f3; --bg3:#e8e8e8; --bg4:#e2e2e2; --bd:#cccccc; --bd2:#767676;
  --fg:#1e1e1e; --fg2:#4a4a4a; --fg3:#595959;
  --acc:#005fb8; --acc-fg:#ffffff; --acc-h:#0a4f96; --acc2:#0050a0; --acc-bg:#cfe6fa; --focus:#005fb8;
  --ok:#0f6b4f; --warn:#8a5a00; --err:#b42318;
  --st-M:#0550ae; --st-A:#146c2e; --st-D:#b42318; --st-C:#b4132a; --st-U:#595959; --st-X:#954600; --st-R:#6639ba;
  --add-bg:#dcf5e1; --add-fg:#0f5a26; --add-hl:#9be0ae; --del-bg:#fbe0e0; --del-fg:#8f1d1d; --del-hl:#f2a8a8;
  --hunk-bg:#e1edfb; --hunk-fg:#0a4f96; --empty-bg:#f0f0f0;
  --syn-kw:#0b4fb3; --syn-str:#a33d00; --syn-cm:#2d6a2d; --syn-num:#1f6b3a; --syn-ty:#0f6b73;
  --chip-ok-bg:#d8f3e8; --chip-ok-fg:#0b5a40; --chip-fail-bg:#fbe0dc; --chip-fail-fg:#8f1d12; --chip-run-bg:#dcecfb; --chip-run-fg:#0a4f96;
  --warn-bg:#fff0c2; --warn-fg:#5c3d00;
  --shadow:rgba(0,0,0,.25); --scrim:rgba(0,0,0,.35);
}
:root[data-theme="blue"] {
  color-scheme: dark;
  --bg0:#1f2d45; --bg1:#243551; --bg2:#2b3d5c; --bg3:#344a6c; --bg4:#36507c; --bd:#4d6893; --bd2:#8aa3cc;
  --fg:#f3f7fd; --fg2:#cbd7ea; --fg3:#b9c8e0;
  --acc:#1a62ae; --acc-fg:#ffffff; --acc-h:#2272c9; --acc2:#9bcdff; --acc-bg:#285c99; --focus:#ffffff;
  --ok:#6fe0c4; --warn:#ffd36b; --err:#ffa08e;
  --st-M:#b3d2ff; --st-A:#8cf0b5; --st-D:#ffb0b0; --st-C:#ffbac6; --st-U:#d8e2f2; --st-X:#ffc680; --st-R:#dcc8ff;
  --add-bg:#1a4a3a; --add-fg:#b6f3c8; --add-hl:#226a4c; --del-bg:#58283a; --del-fg:#ffc9cd; --del-hl:#8f3f55;
  --hunk-bg:#1c3a66; --hunk-fg:#a9d2ff; --empty-bg:#27394f;
  --syn-kw:#9bcdff; --syn-str:#ffc69a; --syn-cm:#a8d5a8; --syn-num:#c6e2b8; --syn-ty:#7fe5d0;
  --chip-ok-bg:#1a4a3a; --chip-ok-fg:#b6f3e0; --chip-fail-bg:#58283a; --chip-fail-fg:#ffd0d4; --chip-run-bg:#1c3a66; --chip-run-fg:#bfe0ff;
  --warn-bg:#5c4a12; --warn-fg:#ffe7a8;
  --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55);
}

}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg0);color:var(--fg);font:13px/1.4 var(--font);overflow:hidden;display:flex;flex-direction:column;height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
[hidden]{display:none!important}
.btn{background:var(--bg4);border:1px solid var(--bd2);border-radius:2px;padding:3px 10px;color:var(--fg)}
.btn:hover:not(:disabled){background:#45454c;border-color:var(--acc2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--acc2)}
.btn.sm{padding:1px 7px;font-size:11px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--bg4);border-color:var(--bd2)}
input[type=text],input[type=number],textarea,select{background:var(--bg1);border:1px solid var(--bd2);border-radius:2px;padding:3px 6px;width:100%}
textarea{resize:vertical;font-family:var(--font)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--fg3);border-top-color:var(--acc2);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:9px;background:#5a3d00;color:#ffd27a;border:1px solid #8a6100;white-space:nowrap}
.tag.soon{background:#3b2a52;color:#d9b8ff;border-color:#6a4a8f}
.tag.info{background:#10324f;color:#9fd0ff;border-color:#1c5a91}
.tag.ok{background:#12372d;color:#8be3c7;border-color:#1d6b55}
.muted{color:var(--fg2)} .small{font-size:11px}

/* ---------- barra superiore della demo ---------- */
.demo-top{min-height:46px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:4px 14px;flex:none;background:#0f0f10;border-bottom:1px solid var(--bd)}
.demo-top h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
.demo-top h1 span{color:var(--acc2)}
.tabs{display:flex;gap:2px}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:12px 12px 10px;color:var(--fg2)}
.tabs button[aria-selected=true]{color:#fff;border-bottom-color:var(--acc2)}
.tabs button:hover{color:#fff}
.demo-top .sp{flex:1}
#page{flex:1;min-height:0;position:relative}
.view{height:100%}
.sim{display:flex;height:100%}
.vs{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg1)}
.sim-panel{width:330px;flex:none;background:var(--bg2);border-left:1px solid var(--bd);overflow:auto;padding:10px 12px 40px}
body.panel-closed .sim-panel{display:none}
@media (max-width:1250px){
  .sim-panel{position:absolute;right:0;top:0;bottom:0;z-index:40;box-shadow:-8px 0 24px #000a}
}

/* ---------- Visual Studio mock ---------- */
.vs-title{height:30px;display:flex;align-items:center;background:var(--bg0);border-bottom:1px solid var(--bd);padding-left:8px;gap:2px;position:relative}
.vs-logo{width:18px;height:18px;margin-right:6px;background:linear-gradient(135deg,#8661c5,#5c2d91);border-radius:3px;color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center}
.menubar{display:flex;gap:0}
.menubar>div{position:relative}
.menubar>div>button{background:transparent;border:0;padding:5px 9px;font-size:12.5px}
.menubar>div>button:hover,.menubar>div>button[aria-expanded=true]{background:var(--bg4)}
.vs-title .sp{flex:1}
.vs-title .sol-name{color:var(--fg2);font-size:12px;margin-right:14px}
.dd{position:absolute;top:100%;left:0;min-width:230px;background:var(--bg3);border:1px solid var(--bd2);box-shadow:0 6px 18px #000a;padding:3px 0;z-index:60}
.dd button,.ctx button{display:flex;width:100%;justify-content:space-between;gap:20px;background:transparent;border:0;text-align:left;padding:4px 22px 4px 18px;font-size:12.5px;white-space:nowrap}
.dd button:hover:not(:disabled),.ctx button:hover:not(:disabled){background:var(--acc-bg)}
.dd button:disabled,.ctx button:disabled{color:var(--fg3);cursor:default}
.dd hr,.ctx hr{border:0;border-top:1px solid var(--bd);margin:3px 0}
.dd .sub{position:relative}
.dd .sub>.dd{left:100%;top:-4px}
.dd kbd{color:var(--fg3);font-family:inherit;font-size:11px}
.vs-body{flex:1;display:flex;min-height:0}
.se{width:230px;flex:none;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.pane-h{background:var(--bg3);padding:5px 8px;font-size:11.5px;text-transform:none;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);min-height:27px}
.se-tree{flex:1;overflow:auto;padding:4px 0}
.se-empty{padding:16px 12px;color:var(--fg2)}
.node{display:flex;align-items:center;gap:5px;padding:2px 6px;cursor:default;white-space:nowrap;border:0;background:transparent;width:100%;text-align:left;font-size:12.5px}
.node:hover{background:var(--bg4)}
.node.sel{background:var(--acc-bg)}
.node .ic{width:14px;text-align:center;color:var(--fg2);font-size:11px;flex:none}
.node .cs{color:#68b36b}.node .cfg{color:#9aa}.node .fld{color:#dcb67a}
.center{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg1)}
.doc-tabs{display:flex;background:var(--bg0);border-bottom:1px solid var(--bd);min-height:30px;overflow:hidden}
.doc-tabs button{background:transparent;border:0;border-right:1px solid var(--bd);padding:6px 12px;color:var(--fg2);font-size:12.5px;white-space:nowrap}
.doc-tabs button[aria-selected=true]{background:var(--bg1);color:var(--fg);border-top:2px solid var(--acc2);padding-top:4px}
.doc-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.editor{flex:1;display:flex;min-height:0}
.gutter{background:var(--bg1);color:var(--fg3);font:12px/1.5 var(--mono);text-align:right;padding:8px 8px 8px 12px;user-select:none;overflow:hidden;white-space:pre}
.editor textarea{flex:1;border:0;border-radius:0;background:var(--bg1);font:12px/1.5 var(--mono);padding:8px;resize:none;white-space:pre;overflow:auto;width:auto}
.ed-bar{display:flex;align-items:center;gap:10px;padding:4px 10px;background:var(--bg2);border-top:1px solid var(--bd);font-size:11.5px;color:var(--fg2)}
.welcome{margin:auto;max-width:430px;text-align:center;color:var(--fg2);padding:20px}
.welcome h2{color:var(--fg);font-weight:400;margin:0 0 8px}
.dock{width:470px;flex:none;background:var(--bg2);border-left:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.dock-tabs{display:flex;background:var(--bg3);border-bottom:1px solid var(--bd)}
.dock-tabs button{background:transparent;border:0;padding:5px 12px;color:var(--fg2);font-size:12px;border-top:2px solid transparent}
.dock-tabs button[aria-selected=true]{color:var(--fg);background:var(--bg2);border-top-color:var(--acc2)}
.dock-tabs .x{padding:5px 7px;margin-left:-8px;color:var(--fg3)}
.dock-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.dock-empty{margin:auto;padding:20px;text-align:center;color:var(--fg2)}
.vs-status{height:23px;background:#68217a;color:#fff;display:flex;align-items:center;padding:0 10px;font-size:12px;gap:16px}
.vs-status.err{background:#a1260d}
.vs-status .sp{flex:1}
@media (max-width:1100px){.se{width:170px}.dock{width:400px}}

.ctx{position:fixed;background:var(--bg3);border:1px solid var(--bd2);box-shadow:0 6px 18px #000a;padding:3px 0;z-index:200;min-width:190px}
/* ---------- sim panel ---------- */
.sim-panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);margin:16px 0 6px;font-weight:600}
.sim-panel h3:first-child{margin-top:0}
.tg{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px;cursor:pointer}
.tg input{width:auto;accent-color:var(--acc2)}
.tg .hint{font-size:10.5px;color:var(--fg3);display:block}
.sim-panel .btn{margin:2px 4px 2px 0}
.cmdlog{background:var(--bg0);border:1px solid var(--bd);height:130px;overflow:auto;font:11px/1.4 var(--mono);padding:5px 7px;color:#b5c7d6;white-space:pre-wrap}
.cmdlog .c{color:#e5c07b}
.note{background:#10324f;border:1px solid #1c5a91;color:#bfe0ff;border-radius:3px;padding:6px 8px;font-size:11.5px;margin:6px 0}
.chain{font-size:11.5px;color:var(--fg2);margin-top:4px}

/* ---------- modali ---------- */
#overlay{position:fixed;inset:0;background:#000a;display:none;z-index:300;align-items:center;justify-content:center;padding:20px}
#overlay.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bd2);box-shadow:0 12px 48px #000d;min-width:360px;max-width:min(680px,96vw);max-height:92vh;display:flex;flex-direction:column}
.modal.wide{width:min(900px,96vw);max-width:96vw}
.m-title{padding:8px 12px;background:var(--bg3);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:12.5px}
.m-body{padding:16px 16px 12px;overflow:auto;white-space:normal}
.m-body.msg{display:flex;gap:14px}
.m-ico{font-size:28px;line-height:1}
.m-body p{margin:0 0 8px;white-space:pre-wrap}
.m-foot{padding:10px 14px;display:flex;justify-content:flex-end;gap:8px;background:var(--bg3);border-top:1px solid var(--bd);flex-wrap:wrap;align-items:center}
.m-foot .l{margin-right:auto}
.banner{background:#3b2a52;color:#e6d0ff;border:1px dashed #8a63b8;padding:5px 10px;font-size:11.5px;text-align:center}
.opt-grid{display:grid;grid-template-columns:200px 1fr;gap:0;min-height:380px}
.opt-tree{background:var(--bg1);border-right:1px solid var(--bd);padding:6px 0;font-size:12.5px}
.opt-tree div{padding:3px 12px;color:var(--fg2)}
.opt-tree .on{background:var(--acc-bg);color:var(--fg)}
.opt-form{padding:10px 14px;overflow:auto;max-height:62vh}
.opt-row{margin-bottom:11px}
.opt-row label{display:block;font-size:12px;margin-bottom:3px}
.opt-row .h{font-size:11px;color:var(--fg3);margin-top:2px}
.opt-row .bad{color:var(--warn)}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:500;align-items:center;pointer-events:none}
.toast{background:#0b3a63;border:1px solid var(--acc2);padding:8px 16px;border-radius:3px;box-shadow:0 4px 16px #000a;animation:fi .2s;max-width:80vw}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.vsix{width:520px}
.vsix .row{display:flex;gap:12px;align-items:center}
.vsix .logo{width:54px;height:54px;border-radius:8px;background:linear-gradient(135deg,#0e70c0,#5c2d91);display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff}

/* ---------- tour ---------- */
#tour{flex:none;background:#12263a;border-top:2px solid var(--acc2);padding:8px 14px 10px;max-height:40vh;overflow:auto;position:relative;z-index:30}
#tour .tcard{display:flex;gap:18px;align-items:flex-start}
#tour .tl{flex:1;min-width:0}
#tour .tr{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:360px}
#tour .th2{display:flex;gap:12px;align-items:center;font-size:12px;color:#9fd0ff;margin-bottom:2px}
#tour h4{margin:0 0 3px;font-size:14px}
#tour p{margin:0 0 5px;font-size:12.5px}
#tour .done{color:var(--ok);font-weight:600}
#tour .hint{background:#0b1b2b;border-left:3px solid var(--acc2);padding:5px 8px;font-size:11.5px;margin:5px 0}
#tour .ptr{font-size:11.5px;color:#ffd24a}
.dots{display:flex;gap:4px}.dots i{width:18px;height:4px;background:#2c4a66;border-radius:2px}.dots i.on{background:var(--acc2)}.dots i.cur{background:#fff}
.tour-target{outline:2px solid #ffd24a!important;outline-offset:2px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{outline-color:#ffd24a00}}
@media (max-width:800px){#tour .tcard{flex-direction:column;gap:6px}#tour .tr{justify-content:flex-start;max-width:none}#tour{max-height:34vh;padding:6px 12px}#tour .btn{padding:2px 8px}.demo-top .btn{padding:2px 8px}}


/* ---------- layout stretto ---------- */
.nv{display:none;gap:3px;margin-left:8px}
.dock{container-type:inline-size}
@container (max-width:420px){.frow{grid-template-columns:auto 18px 1fr auto}.frow .act{display:none}}
.tw .row{flex-wrap:wrap}
.modal{min-width:min(360px,92vw)}
@media (max-width:1000px){
  .nv{display:flex}
  .menubar>div.dummy{display:none}
  .se{display:none;position:absolute;left:0;top:30px;bottom:23px;z-index:50;box-shadow:6px 0 18px #000a;width:230px}
  .vs-body.se-open .se{display:flex}
  .vs-body.v-doc .dock{display:none}
  .vs-body.v-dock .center{display:none}
  .dock{width:100%;border-left:0}
  .vs-title .sol-name{display:none}
}
@media (max-width:700px){.demo-top .tag{display:none}.demo-top h1{font-size:13px}}

/* ---------- prossimamente ---------- */
.soon-wrap{height:100%;overflow:auto;padding:22px 26px 60px;background:var(--bg0)}
.soon-wrap h2{margin:0 0 4px}
.soon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
.card{position:relative;background:var(--bg2);border:1px dashed var(--bd2);padding:14px;border-radius:4px;filter:saturate(.35);opacity:.92}
.card h3{margin:0 0 6px;font-size:14px;color:var(--fg)}
.card p{margin:0 0 10px;color:var(--fg2);font-size:12.5px}
.card .tag{position:absolute;top:10px;right:10px}
.card ul{margin:0 0 10px;padding-left:18px;color:var(--fg2);font-size:12px}
.blame{font:12px/1.5 var(--mono);width:100%;border-collapse:collapse}
.blame td{padding:0 6px;white-space:pre}
.blame td:nth-child(1){color:var(--fg3)}.blame td:nth-child(2){color:var(--acc2)}.blame td:nth-child(3){color:var(--ok)}
.blame tr:hover{background:var(--bg3)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.three pre{margin:0;background:var(--bg1);border:1px solid var(--bd);padding:6px;font:11.5px/1.45 var(--mono);height:190px;overflow:auto}
.three h5{margin:0 0 3px;font-size:11.5px;color:var(--fg2)}
.sugg{position:absolute;background:var(--bg3);border:1px solid var(--bd2);box-shadow:0 6px 16px #000a;z-index:5;min-width:280px}
.sugg button{display:block;width:100%;background:transparent;border:0;text-align:left;padding:4px 8px}
.sugg button:hover,.sugg button.on{background:var(--acc-bg)}

/* ---------- UI.Web incorporata (iframe) ---------- */
.uiframe{display:block;width:100%;height:100%;border:0;background:var(--bg2)}
.dock-body{overflow:hidden}
.doc-frames{position:absolute;inset:0}
.doc-frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg1)}
.doc-frames iframe[hidden]{display:none}
.theme-sel{display:flex;gap:6px;align-items:center;margin:4px 0}
/* barra della demo e tour: sempre scure, indipendenti dal tema di Visual Studio */
.demo-top,#tour{--fg:#e6e6e6;--fg2:#b8b8b8;--fg3:#a4a4a4;--bg4:#33333a;--bd2:#6b6b75;--acc2:#6cb6ff;color:var(--fg)}
.soon-wrap{color:var(--fg)}

</style>
</head>
<body class="panel-closed">
<header class="demo-top">
  <h1>SVN<span>Assist</span> &middot; demo interattiva</h1><span class="tag soon" title="Versione">0.2.0</span>
  <nav class="tabs" role="tablist" aria-label="Sezioni della demo">
    <button role="tab" id="tabbtn-sim" aria-selected="true" data-act="tab" data-arg="sim">Simulazione</button>

){.spin{animation-duration:2s}}\n\n/* struttura */\n.app{display:flex;flex-direction:column;height:100vh;min-height:0;position:relative}\n.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;flex:none;flex-wrap:wrap}\n.branch{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}\n.branch b{overflow:hidden;text-overflow:ellipsis}\nbutton.branch{background:none;border:0;border-radius:4px;color:inherit;font:inherit;padding:2px 6px;cursor:pointer}\nbutton.branch:hover{background:var(--bg3)}\nbutton.branch:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}\n.wc{display:flex;gap:6px;align-items:center;padding:0 8px 6px}\n.wc label{font-weight:600;white-space:nowrap}\n.commit{padding:0 8px 4px;flex:none;display:flex;flex-direction:column;gap:2px}\n.commit .bar{padding:6px 0 2px}\n.ai-s{font-size:.92em;color:var(--fg2);padding:2px 0}\n.trace{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.9em;padding:2px 0}\n.chip{display:inline-flex;gap:4px;align-items:center;padding:1px 8px;border-radius:10px;border:1px solid var(--bd2);background:var(--bg3);color:var(--fg2);white-space:nowrap}\n.chip.ok{background:var(--chip-ok-bg);color:var(--chip-ok-fg);border-color:transparent}\n.chip.fail{background:var(--chip-fail-bg);color:var(--chip-fail-fg);border-color:transparent}\n.chip.run{background:var(--chip-run-bg);color:var(--chip-run-fg);border-color:transparent}\n.chip.skip{border-style:dashed}\n.dl{background:var(--bg3);border:1px solid var(--bd);border-radius:4px;padding:6px 8px;font-size:.92em;margin:3px 0}\nprogress{display:block;width:100%;height:8px;margin:4px 0;accent-color:var(--acc2)}\n.foot{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:4px 8px;border-top:1px solid var(--bd);background:var(--bg3);flex:none;min-height:30px}\n.foot-r1,.foot-r2{display:flex;align-items:center;gap:8px;min-width:0}\n.foot-r1{min-height:22px}\n.foot .msg{display:inline-flex;alig   function rowsOf(sec, items) {
    const rows = [], v = S.vm;
    if (v.view === 'list') {
      items.slice().sort((a, b) => base(a.path).localeCompare(base(b.path), 'it', { sensitivity: 'base' }) || a.path.localeCompare(b.path)).forEach(it => rows.push(fileRow(sec, it, 0, true)));
      return rows;
    }
    const walk = (node, depth) => {
      node.dirs.slice().sort(byLabel).forEach(d => {
        const { cur, label } = compactNode(d), ck = 's:' + sec + ':' + cur.path, exp = !v.collapsed[ck];
        const its = under(items, cur.path);
        rows.push({ key: key(sec, cur.path), kind: 'folder', depth, name: fwd(label), detail: '', expanded: exp, count: its.length, status: null, statusText: '',
          can: { diff: its.some(f => f.st !== '?' && !f.dir), stage: sec !== 'staged' && its.some(f => f.st !== 'C'), unstage: sec === 'staged', add: sec === 'unversioned', ignore: sec === 'unversioned', revert: sec === 'changes', resolve: false, deleteFile: false }, tooltip: fwd(cur.path) });
        if (exp) walk(cur, depth + 1);
      });
      node.files.slice().sort((a, b) => fname(a).localeCompare(fname(b), 'it', { sensitivity: 'base' })).forEach(it => rows.push(fileRow(sec, it, depth, false)));
    };
    walk(buildTree(items), 0);
    return rows;
  }
  function prereq() {
    const P = prqSnap();
    return { open: !!S.ui.prereq, summary: tr(S.prq.init ? P.summary : 'Prerequisiti'), ai: P.ai, feedback: tr(S.prq.feedback || ''),
      items: P.items.map(i => ({ id: i.id, group: i.g, title: i.title, ok: !!i.ok, detail: i.detail, instructions: i.ok ? '' : (i.instr || ''), primary: i.p1 || '', secondary: i.p2 || '' })) };
  }
  function aiLevel(v) {
    const m = v.aiMsg || '';
    return v.aiBusy ? 'busy' : !m ? '' : /^Errore/.test(m) ? 'err' : /^(Nessun|Metti almeno|Scrivi prima|Operazione)/.test(m) ? 'warn' : /^Messaggio/.test(m) ? 'ok' : 'info';
  }
  function rpSnap() {   // scelta della revisione: stesse regole del backend (ultime N revisioni dal log)
    const r = S.vm.rp;

    return { open: true, target: WC, loading: !!r.loading, error: tr(r.error || ''), canMore: S.log.length > r.limit,
      items: S.log.slice(0, r.limit).map(e => ({ rev: e.rev, author: e.author, date: e.date.toISOString(), msg: String(e.msg).split('\n')[0] })) };
  }
  function swSnap() {   // selettore di SVN Switch (stesse regole del backend)
    const s = S.vm.sw;
    if (!s) return { open: false, loading: false, error: '', items: [] };
    return { open: true, loading: !!s.loading, error: tr(s.error || ''), items: s.loading ? [] : SW_ITEMS.map(([name, kind]) => ({ name, kind, current: name === S.branch })) };
  }
  function snapshotChanges() {
    const v = S.vm;
    const sections = SECS.map(([id, title]) => { const items = secItems(id); return { id, title: tr(title), count: items.length, expanded: !v.collapsed['sec:' + id], rows: rowsOf(id, items) }; });
    const msg = v.statusMsg || '';
    return {
      workingCopy: { path: v.wcPath || '', showInput: !!v.showInput, branch: v.branch || '', rev: S.wcRev || 0, svnVersion: '1.14.3' },
      commit: { text: v.commitMsg || '', aiStatus: tr(v.aiMsg || ''), aiLevel: aiLevel(v), aiSeq: v.aiSeq || 0, busy: !!v.aiBusy, lang: String(v.lang || S.settings.defaultlanguage || 'auto').toLowerCase(),
        trace: (v.trace || []).map(t => ({ name: t.name, state: t.state, detail: t.detail || '' })), download: v.dl ? { pct: v.dl.pct, label: v.dl.label } : null,
        count: commitSet().files.length, all: commitSet().all },
      view: v.view, theme: { mode: theme.mode, kind: kindOf() }, sections, status: { msg: tr(msg), err: !!v.err || /^Errore/.test(msg), ...(/E155004/.test(msg) ? { action: { label: tr('Esegui Cleanup'), cmd: 'cleanup' } } : {}) }, prereq: prereq(), loading: !!v.loading, wizard: wizardSnap(), revPicker: rpSnap(), switchPicker: swSnap(),
    };
  }
  function logMatch(e) {   // stessi filtri del backend: sottostringhe senza maiuscole, date incluse
    const f = S.lvm.filter; if (!f) return true;
    const has = (h, n) => !n || String(h).toLowerCase().includes(String(n).toLowerCase()), day = e.date.toISOString().slice(0, 10);
    return has(e.author, f.author) && has(e.msg, f.text) && (!f.path || e.paths.some(p => has(p.p, f.path.replace(/\\/g, '/')))) && (!f.from || day >= f.from) && (!f.to || day <= f.to);
  }
  function snapshotLog() {
    const l = S.lvm;
    return { path: l.path || '', msg: tr(l.msg || ''), err: /^Errore/.test(l.msg || ''), loading: /^Caricamento/.test(l.msg || ''), canMore: !!l.canMore, sel: l.sel == null ? null : l.sel,
      entries: l.entries.filter(logMatch).map(e => ({ rev: e.rev, author: e.author, date: e.date.toISOString(), msg: e.msg, paths: e.paths.map(p => ({ a: p.a, p: p.p })) })), diff: tr(l.diff || ''),
      filter: l.filter || { author: '', text: '', path: '', from: '', to: '' }, files: l.files || null };
  }
  function snapshotDiff(id) {
    const d = S.ui.diffs.find(x => x.id === id); if (!d) return { title: 'Diff', subtitle: '', diff: '' };

  }
  const stateFor = f => f.view === 'changes' ? snapshotChanges() : f.view === 'log' ? snapshotLog() : snapshotDiff(f.id);

  // ---------- trasporto ----------
  const deliver = (f, m) => { const fn = handlers.get(f.win); if (fn) queueMicrotask(() => { try { fn(JSON.parse(JSON.stringify(m))); } catch (e) { console.error(e); } }); };
  function pushAll() {
    const t = JSON.stringify({ kind: kindOf() });
    for (let i = frames.length - 1; i >= 0; i--) {   // scarta i frame distrutti
      const f = frames[i]; let alive = false; try { alive = f.win.frameElement && f.win.frameElement.isConnected; } catch (e) { alive = false; }
      if (!alive) { frames.splice(i, 1); handlers.delete(f.win); }
    }
    for (const f of frames) {
      if (f.theme !== t) { f.theme = t; deliver(f, { v: 1, type: 'theme', kind: kindOf(), vars: {} }); }
      const st = stateFor(f), s = JSON.stringify(st);
      const sig = lang + s;
      if (f.last !== sig) { f.last = sig; deliver(f, { v: 1, type: 'state', view: f.view, id: f.id, lang, rev: ++rev, state: st }); }

  // ---------- comandi ----------
  function stageKey(k, on) {
    const row = getRow(k); if (!row) return;
    row.entries.filter(f => !on || f.st !== 'C').forEach(f => { f.sel = on; });

  }
  const folderCk = k => { const r = getRow(k); return 's:' + r.section + ':' + r.key; };
  function allFolderCks() {
    const out = [];
    const walk = (node, sec) => node.dirs.forEach(d => { const { cur } = compactNode(d); out.push('s:' + sec + ':' + cur.path); walk(cur, sec); });
    SECS.forEach(([id]) => walk(buildTree(secItems(id)), id));
    return out;
  }
  function openDiffTab(id, title, subtitle, paths) {
    if (!S.ui.diffs.some(d => d.id === id)) S.ui.diffs.push({ id, title, subtitle, paths });
    S.ui.active = id; S.ui.view = 'doc'; S.ui.seOpen = false; render();
  }
  async function showDiff(k, folder) {
    const row = getRow(k);
    if (folder) {
      const fs = row.entries.filter(f => f.st !== '?' && !f.dir);
      if (!fs.length) { setStatus('Nessuna modifica da confrontare in questa cartella.'); return render(); }
      await svn(`diff "${fwd(row.key || '.')}"`, 300);
      return openDiffTab('__diff:' + k, 'Diff ' + (row.key ? base(row.key) : row.name), `${fwd(row.key || '.')} · ${fs.length} file`, fs.map(f => f.path));
    }
    const it = row.file; if (!it || !it.canDiff) return;
    if (S.env.tortoise) { await sleep(250); toast('Diff aperto in TortoiseSVN: ' + it.path); logCmd('TortoiseProc.exe /command:diff /path:"' + WC + '\\' + it.path + '"'); return; }
    await svn(`diff "${fwd(it.path)}"`, 300);

  const C = {
    refresh: () => { S.vm.statusAuto = true; return vmRefresh(undefined, true); },
    update: () => vmUpdate(),
    updateToRevision: () => vmUpdateRev(),
    revPickerMore: () => rpMore(),

    revPickerOk: a => rpOk(a),
    switchOpen: () => vmSwitchOpen(false),
    switchRefresh: () => vmSwitchOpen(true),
    switchCancel: () => { S.vm.sw = null; render(); },
    switchOk: a => swOk(a),
    showLog: () => {

    commit: () => vmCommit(),
    setCommitText: a => { S.vm.commitMsg = String(a.text || ''); },   // niente render: e' la UI a tenere il testo
    genAi: () => vmAi('gen'),

    setLanguage: a => { S.vm.lang = a.lang; render(); },
    setWorkingCopy: a => { S.vm.wcPath = String(a.path || ''); return vmRefresh(undefined, true); },
    stage: a => stageKey(a.key, true),
    unstage: a => stageKey(a.key, false),
    toggleFolder: a => { const ck = folderCk(a.key); S.vm.collapsed[ck] = !S.vm.collapsed[ck]; render(); },
    toggleSection: a => { S.vm.collapsed['sec:' + a.sec] = !S.vm.collapsed['sec:' + a.sec]; render(); },

    showDiff: a => showDiff(a.key, false),

    rowOp: a => rowOp(a.op, a.key),
    setTheme: a => { theme.mode = ['auto', 'light', 'dark', 'blue'].includes(a.mode) ? a.mode : 'auto'; render(); },
    prereqToggle: () => ACT.prereqToggle(),
    prereqRecheck: () => prqRecheck(),
    prereqRun: a => prqRun(a.id + '|' + (a.primary ? 1 : 2)),
    ...Object.fromEntries(['wizardOpen', 'wizardOpenPrereq', 'wizardCancel', 'wizardPick', 'wizardBack', 'wizardNext', 'wizardRecheck', 'wizardRun', 'wizardLogin', 'wizardSetAuth', 'wizardFinish', 'openOptions'].map(n => [n, a => WIZ[n](a)])),   // WIZ e' definito in demo.js (caricato dopo)
    logLoad: a => { S.lvm.path = String(a.path || ''); return lvmLoad(50); },
    logMore: () => lvmMore(),
    logSelect: a => { S.lvm.files = null; return lvmSelect(+a.rev); },

      if (f.from && f.to && f.from > f.to) [f.from, f.to] = [f.to, f.from];

function lcsOps(a, b) {
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { ops.push({ t: ' ', s: a[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: '-', s: a[i++] }); }
    else { ops.push({ t: '+', s: b[j++] }); }
  }
  while (i < n) ops.push({ t: '-', s: a[i++] });
  while (j < m) ops.push({ t: '+', s: b[j++] });
  return ops;
}
function unifiedHunks(a, b, ctx = 3) {
  const ops = lcsOps(a, b), ch = [];
  ops.forEach((o, i) => { if (o.t !== ' ') ch.push(i); });
  if (!ch.length) return '';
  const groups = []; let s = ch[0], e = ch[0];
  for (let k = 1; k < ch.length; k++) { if (ch[k] - e <= 2 * ctx + 1) e = ch[k]; else { groups.push([s, e]); s = e = ch[k]; } }
  groups.push([s, e]);
  const out = [];
  for (const [gs, ge] of groups) {
    const from = Math.max(0, gs - ctx), to = Math.min(ops.length - 1, ge + ctx);
    let os = 0, ns = 0;
    for (let i = 0; i < from; i++) { if (ops[i].t !== '+') os++; if (ops[i].t !== '-') ns++; }
    let oc = 0, nc = 0; const lines = [];
    for (let i = from; i <= to; i++) { const o = ops[i]; if (o.t !== '+') oc++; if (o.t !== '-') nc++; lines.push(o.t + o.s); }
    out.push(`@@ -${oc === 0 ? os : os + 1},${oc} +${nc === 0 ? ns : ns + 1},${nc} @@`, ...lines);
  }
  return out.join('\n');
}
const lines = t => (t == null || t === '' ? [] : t.split('\n'));
function mkDiff(path, a, b, revOld, revNew, ctx = 3) {
  const hunks = unifiedHunks(lines(a), lines(b), ctx);
  if (!hunks) return '';
  const p = fwd(path);
  const o = a == null ? '(nonexistent)' : `(revision ${revOld})`;
  const n = b == null ? '(nonexistent)' : (revNew ? `(revision ${revNew})` : '(working copy)');
  return `Index: ${p}\n${'='.repeat(67)}\n--- ${p}\t${o}\n+++ ${p}\t${n}\n${hunks}\n`;
}

// ---------- esecuzione AI condivisa (tool window + dialog) ----------
async function aiCore(kind, ui) {
  const r = resolveChain();
  if (!r.chain.length) {
    ui.trace([]); S.f.aiNone = true; S.f.aiPromptShown = true;
    ui.status('Nessun provider AI configurato: completa la procedura guidata.'); wizOpen(true); return;
  }
  if (kind === 'improve' && !ui.draft().trim()) { ui.status(ui.noDraft); return; }
  if (!S.vm.wcPath) { ui.status('Nessuna working copy configurata.'); return; }
  const selAll = commitSet().files;   // come il commit: Staged, o (vuoto) tutte le modifiche dei file versionati
  if (!selAll.length) { ui.status('Nessuna modifica da committare.'); return; }
  const selPaths = selAll.filter(f => !f.dir && ['M', 'A', 'D', 'R', 'C'].includes(f.st)).map(f => f.path);
  ui.busy(true);
  const trace = r.auto ? r.all.map(a => ({ name: a.name, k: a.k, state: a.ok ? 'wait' : 'skip', detail: a.ok ? '' : a.why })) : r.chain.map(a => ({ name: a.name, k: a.k, state: 'wait', detail: '' }));
  ui.trace(trace);
  try {
    ui.status(kind === 'improve' ? ui.improving : ui.generating);
    let diff;
    await svn('diff -x "-U 0 -p" --no-diff-deleted ' + selPaths.map(p => '"' + fwd(p) + '"').join(' '), 500); diff = selPaths.map(p => fileDiffText(p, 0)).filter(Boolean).join('\n').trim();
    if (!diff.trim() && !S.env.bigDiff && kind !== 'improve') { ui.status(ui.noDiff); ui.trace([]); return; }
    const size = S.env.bigDiff ? 54000 : diff.length;
    if (size > 28000 - 1000) {
      const n = Math.ceil(size / 12000);
      for (let i = 1; i <= n; i++) { ui.status(`Diff grande (${Math.round(size / 1000)} KB): riassunto blocco ${i}/${n}...`); await sleep(450); }
    }
    const errors = []; let result = null, first = true, usedName = '';
    for (const c of r.chain) {
      const t = trace.find(x => x.k === c.k); t.state = 'run'; ui.trace(trace);
      try {
        if (S.env.failFirst && first) { await sleep(800); throw new Error(c.k === 'claude' ? 'Anthropic API 529: overloaded_error' : 'AI API error 429 TooManyRequests: rate limit exceeded'); }
        if (c.k === 'copilot') {
          if (!S.env.copilotRuntime) await downloadCopilot(d => ui.dl(d));
          if (!S.env.gh) throw new Error("Sessione Copilot non autenticata: esegui 'gh auth login'");
        } else if (c.k === 'claudecode') {
          await sleep(500);
          if (!S.env.claudeLogin) throw new Error('Claude Code fallito (exit code 1): Not logged in - Please run /login');
        }
        await sleep(1000);
        result = kind === 'improve' ? improveMessage(ui.draft(), ui.lang()) : genMessage(ui.lang());
        t.state = 'ok'; usedName = c.name; ui.trace(trace); break;
      } catch (e) { t.state = 'fail'; t.detail = e.message; errors.push(`${c.name === 'Copilot' ? 'GitHub Copilot' : c.name}: ${e.message}`); ui.trace(trace); }
      first = false;
    }
    if (result == null) throw new Error(r.chain.length > 1 ? 'Nessun provider AI ha risposto.\n' + errors.join('\n') : errors[0].replace(/^[^:]+: /, ''));
    ui.set(result);
    ui.status((kind === 'improve' ? 'Messaggio migliorato' : 'Messaggio generato con AI') + ` (${usedName}).`);
  } catch (e) { ui.status(ui.err + e.message); }
  finally { ui.busy(false); render(); ui.after && ui.after(); }
}

async function lvmLoad(limit) {
  const l = S.lvm; limit = limit || 50;
  if (!l.path.trim()) { l.msg = 'Inserisci il percorso della working copy.'; return render(); }

    l.msg = 'Caricamento log...'; render();

    if (l.path.trim().replace(/\\$/, '').toLowerCase() !== WC.toLowerCase()) throw new Error(`svn: E155007: '${l.path}' is not a working copy`);
    l.limit = limit; l.entries = S.log.slice(0, limit); l.canMore = l.entries.length >= limit;
    l.msg = l.entries.length ? `${l.entries.length} revisioni caricate.` : 'Nessuna revisione trovata.';

  render();
}

// ---------- file watcher (FileSystemWatcher + polling 1 s, debounce 800 ms) ----------
function fsEvent(path, what) {
  S.watch.pending = true; S.watch.last = Date.now(); S.watch.fire = Date.now(); S.watch.note = `${what}: ${path}`; render();
}
setInterval(async () => {
  const w = S.watch;
  if (w.pending && Date.now() - w.last >= 800 && S.ui.statusOpen && S.vm.wcPath && !S.vm.loading) { w.pending = false; logCmd('[watcher] modifica rilevata, refresh automatico'); await vmRefresh(); }
  if (w.fire && Date.now() - w.fire > 1800) { w.fire = 0; render(); }
}, 400);
function saveFile(path) {
  const f = fileBy(path), buf = S.ui.buf[path]; if (!f || buf == null) return;
  if (f.text === buf) return toast('Nessuna differenza da salvare');
  f.text = buf;
  if (f.st === 'N' && f.text !== f.base) f.st = 'M'; else if (f.st === 'M' && f.text === f.base) f.st = 'N';
  toast('File salvato su disco: ' + path);
  fsEvent(path, 'FileSystemWatcher: modificato');
}
async function simulateChange() {
  const k = S.simStep++ % 3;
  if (k === 0) {
    const f = S.files.find(x => x.st === 'N' && x.path.endsWith('.cs')) || S.files.find(x => x.st === 'M' && x.path.endsWith('.cs'));
    f.text = (f.text || '') + `\n// modifica simulata ${pad(new Date().getMinutes())}:${pad(new Date().getSeconds())}`;
    if (f.st === 'N') f.st = 'M'; S.ui.buf[f.path] = undefined; fsEvent(f.path, 'modificato');
  } else if (k === 1) {
    const n = 'tools\\debug-' + (S.simStep) + '.log';
    S.files.push(F(n, '?', null, 'log temporaneo'));
    fsEvent(n, 'creato');
  } else {
    const f = S.files.find(x => x.st === 'N' && x.path !== 'Acme.Shop.sln' && !x.path.endsWith('.cs')) || S.files.find(x => x.st === 'N' && x.path !== 'Acme.Shop.sln');
    if (f) { f.st = '!'; f.text = null; fsEvent(f.path, 'eliminato da disco'); } else toast('Nessun file da eliminare');
  }
}

// =====================================================================
//  ELENCO FILE STILE "GIT CHANGES" (come ChangeRowFactory / ChangesTreeBuilder)
//  Lista APPIATTITA di righe (sezione / cartella / file), non un TreeView annidato.
// =====================================================================
const SEC_NAMES = { staged: 'Staged', changes: 'Modifiche', unversioned: 'Non versionati' };
const STNAME = { M: 'Modificato', A: 'Aggiunto', D: 'Eliminato', C: 'Conflitto', '?': 'Non versionato', '!': 'Mancante', R: 'Sostituito', N: 'Normale' };
const secOf = f => f.sel ? 'staged' : f.st === '?' ? 'unversioned' : 'changes';   // sel = "staged"
const secItems = sec => S.vm.files.filter(f => secOf(f) === sec);
const under = (items, key) => key ? items.filter(f => f.path === key || f.path.startsWith(key + '\\')) : items;
const byLabel = (a, b) => a.label.localeCompare(b.label, 'it', { sensitivity: 'base' });
const fname = f => base(f.path) + (f.dir ? '\\' : '');
function buildTree(items) {
  const root = { label: '', path: '', dirs: [], files: [] };
  for (const it of items) {
    const segs = it.path.split('\\'); let n = root;
    for (let i = 0; i < segs.length - 1; i++) {
      let d = n.dirs.find(x => x.label.toLowerCase() === segs[i].toLowerCase());
      if (!d) { d = { label: segs[i], path: n.path ? n.path + '\\' + segs[i] : segs[i], dirs: [], files: [] }; n.dirs.push(d); }
      n = d;
    }
    n.files.push(it);
  }
  return root;
}
function compactNode(d) { let cur = d, label = d.label; while (cur.files.length === 0 && cur.dirs.length === 1) { cur = cur.dirs[0]; label += '\\' + cur.label; } return { cur, label }; }
// risolve la chiave di riga del protocollo (docs/ui-protocol.md): file | folder | section
function getRow(key) {
  const i = key.indexOf(':'), sec = key.slice(0, i), p = key.slice(i + 1).replace(/\//g, '\\');
  if (sec === 'section') return { kind: 'section', section: p, key: '', entries: secItems(p), name: SEC_NAMES[p] };
  const all = secItems(sec), f = all.find(x => x.path === p);
  if (f) return { kind: 'file', entries: [f], file: f, section: sec };
  return { kind: 'folder', section: sec, key: p, entries: under(all, p), name: p };
}
const confirmBox = text => modal({ title: 'SVNAssist', icon: '&#10067;', cancel: false, body: `<p>${esc(text)}</p>`, buttons: [{ label: 'OK', value: true, primary: true }, { label: 'Annulla', value: false }] });
const listForConfirm = es => es.slice(0, 8).map(e => `• ${e.path} (${STNAME[e.st]})`).join('\n') + (es.length > 8 ? `\n… e altri ${es.length - 8}` : '');
const IS_REV = ['M', 'A', 'D', 'C', '!', 'R'];
async function rowOp(op0, key) {
  const op = { add: 'add', deleteFile: 'del', revert: 'rev', resolve: 'res', ignore: 'ign', lock: 'lock', unlock: 'unlock' }[op0];
  const vm = S.vm, row = getRow(key); if (!row || !op) return;
  const done = async msg => { await vmRefresh(msg); };
  try {
    if (op === 'add') {
      const aff = row.entries.filter(f => f.st === '?');
      if (!aff.length) { setStatus('Nessun elemento non versionato da aggiungere.'); return render(); }
      setStatus('Aggiunta a SVN in corso...'); render();
      await svn(`add --force ${row.kind === 'folder' && row.section === 'unversioned' ? '"' + fwd(row.key) + '"' : '--targets (' + aff.length + ' elementi)'}`, 500);
      aff.forEach(f => svnAdd(f.path)); aff.forEach(f => { f.sel = true; });
      await done(`Aggiunti a SVN: ${aff.length} elementi.`);
    } else if (op === 'del') {   // Canc su un file: elimina dal filesystem (con conferma) come Git Changes
      const f = row.file; if (!f || f.dir) { setStatus('Seleziona un file da eliminare.'); return render(); }
      let msg = f.st === '?' ? `Eliminare "${f.path}" dal disco?\n\nIl file non è versionato: l'operazione non è annullabile.` : `Eliminare "${f.path}"?\n\nIl file verrà eliminato dalla cartella di lavoro e rimosso da SVN al prossimo commit.`;
      const force = ['M', 'R', 'C', 'A'].includes(f.st);
      if (force) msg += '\n\nATTENZIONE: il file ha modifiche locali non committate, che andranno perse.';
      if (!await confirmBox(msg)) return;
      setStatus('Eliminazione in corso...'); render();
      if (f.st === '?') { await svn(`(rimozione dal disco) "${fwd(f.path)}"`, 300); S.files = S.files.filter(x => x.path !== f.path); }
      else if (f.st === '!') { await svn(`delete "${fwd(f.path)}"`, 400); svnDelete(f.path); }
      else { await svn(force ? `delete --force "${fwd(f.path)}"` : `delete "${fwd(f.path)}"`, 500); svnDelete(f.path); }
      await done(`Eliminato: ${f.path}.`);
    } else if (op === 'lock') {
      const f = row.file; if (!f || f.dir || f.locked || f.st !== 'M') { setStatus('Seleziona un file modificato non ancora bloccato.'); return render(); }
      setStatus('Lock in corso...'); render();
      await svn(`lock "${fwd(f.path)}"`, 400); LOCKS.add(f.path);
      await done(`Bloccato (lock): ${f.path}`);
    } else if (op === 'unlock') {
      const f = row.file; if (!f || !f.locked) { setStatus('Seleziona un file bloccato da te.'); return render(); }
      setStatus('Unlock in corso...'); render();
      await svn(`unlock "${fwd(f.path)}"`, 400); LOCKS.delete(f.path);
      await done(`Sbloccato (unlock) completato: ${f.path}`);
    } else if (op === 'rev') {
      const t = row.entries.filter(f => IS_REV.includes(f.st));
      if (!t.length) { setStatus('Nessun elemento idoneo per SVN Revert.'); return render(); }
      const scope = row.kind === 'folder' ? ` nella cartella "${row.key}"` : row.kind === 'section' ? ` (${SEC_NAMES[row.section]})` : '';
      if (!await confirmBox(`Annullare le modifiche locali su ${t.length} elementi${scope}?\n\n${listForConfirm(t)}\n\nLe modifiche andranno perse e l'operazione non è annullabile.`)) return;
      setStatus('Revert in corso...'); render();
      await svn(`revert --depth infinity --targets (${t.length} elementi)`, 500); t.forEach(f => svnRevert(f.path));
      await done(`Revert completato su ${t.length} elementi.`);
    } else if (op === 'res') {
      const f = row.file; if (!f || f.st !== 'C') { setStatus('Seleziona un file in conflitto da risolvere.'); return render(); }
      const pick = await modal({
        title: 'SVNAssist', icon: '&#10067;', cancel: null,
        body: `<p>Come vuoi risolvere il conflitto su "${esc(base(f.path))}"?\n\n• Ho risolto a mano: tieni il file com'è (sistemato a mano, senza marcatori &lt;&lt;&lt;&lt;&lt;&lt;&lt;)\n• Tieni il mio file: scarta le modifiche del server, vale il tuo file intero\n• Prendi quello del server: scarta le TUE modifiche locali\n• Torna alla base: scarta le modifiche di entrambi</p>`,
        buttons: [{ label: 'Ho risolto a mano', value: 'working', primary: true }, { label: 'Tieni il mio file', value: 'mine-full' }, { label: 'Prendi quello del server', value: 'theirs-full' }, { label: 'Torna alla base', value: 'base' }, { label: 'Annulla', value: null }],
      });
      if (!pick) return;
      setStatus('Risoluzione conflitto in corso...'); render();
      await svn(`resolve --accept ${pick} "${fwd(f.path)}"`, 400); svnResolve(f.path, pick);
      await done(`Conflitto risolto: ${f.path}`);
    } else if (op === 'ign') {
      const t = row.entries.filter(f => f.st === '?');
      if (!t.length) { setStatus('Add to Ignore List è disponibile solo per elementi non versionati.'); return render(); }
      if (row.kind !== 'file' && !await confirmBox(`Aggiungere ${t.length} elementi non versionati alla ignore list (svn:ignore) delle rispettive cartelle?\n\n${listForConfirm(t)}`)) return;
      setStatus('Aggiornamento ignore list in corso...'); render();
      await svn('propset svn:ignore', 400); t.forEach(f => { if (fileBy(f.path)) svnIgnore(f.path); });
      await done(`Aggiunti alla ignore list: ${t.length} elementi.`);
    }
  } catch (e) {
    const lab = { add: 'add', del: 'delete', rev: 'revert', res: 'resolve', ign: 'ignore list' }[op];
    setStatus(`Errore ${lab}: ${e.message}`); render();
  }
}

// =====================================================================
//  MENU "SVN" nel tasto destro di Esplora soluzioni (SolutionExplorerMenu / SvnContextCommands)
//  I comandi rispondono con message box (ShowPromptAsync), come la vera estensione.
// =====================================================================
const wcUnder = path => S.files.filter(f => !path || f.path === path || f.path.startsWith(path + '\\'));
const EN_ST = { M: 'Modified', A: 'Added', D: 'Deleted', C: 'Conflicted', '?': 'Unversioned', '!': 'Missing', R: 'Replaced' };
const CONTAINER_EXT = ['.sln', '.slnx', '.csproj', '.vbproj', '.fsproj', '.vcxproj', '.proj', '.shproj', '.wapproj'];
const showText = text => modal({ title: 'SVNAssist', wide: true, cancel: true, body: `<pre class="cmd" style="max-height:55vh;overflow:auto;white-space:pre">${esc(text)}</pre>` });
// equivalente di SvnTarget.Resolve: .sln/.csproj -> cartella che li contiene
function seTarget(type, path) {
  let p = path, isDir = true;
  if (type === 'file') { const m = path.match(/\.[^.\\]+$/); if (m && CONTAINER_EXT.includes(m[0].toLowerCase())) p = parentDir(path) === '.' ? '' : parentDir(path); else isDir = false; }
  const full = p ? WC + '\\' + p : WC, pd = parentDir(p);
  return { path: p, full, isDir, inWc: !!(S.solution && S.solution.inWc), workDir: isDir ? full : (pd === '.' || !p ? WC : WC + '\\' + pd), workRel: isDir ? p : (pd === '.' ? '' : pd) };
}
const ERR_TITLE = { update: "Errore durante l'update", commit: "Errore nell'apertura di SVN Changes", diff: 'Errore durante il diff', log: "Errore nell'apertura del log", add: "Errore durante l'add", revert: 'Errore durante il revert', ign: "Errore durante l'aggiunta alla ignore list" };
async function seOp(kind, arg) {
  const i = arg.indexOf('|'), type = arg.slice(0, i), path = arg.slice(i + 1);
  if (!(await ensureSvn()) && !S.env.svn) return;
  if (!S.solution) return;
  const t = seTarget(type, path);
  if (!t.inWc) { await prompt(`Non è una working copy SVN:\n${t.full}`); return; }
  let refresh = false;
  try {
    if (kind === 'update') {
      await svn(`update "${fwd(t.workRel || '.')}"`, 900); svnUpdate();
      const conf = S.files.filter(f => f.st === 'C').map(f => f.path);
      let summary = `Aggiornato alla revisione ${S.headRev}`;
      if (conf.length) summary += `\n\n${conf.length} elementi in conflitto:\n${conf.slice(0, 15).join('\n')}${conf.length > 15 ? `\n... e altri ${conf.length - 15}` : ''}`;
      await prompt(`${summary}\n\n${t.workDir}${t.isDir ? '' : '\n(aggiornata la cartella che contiene il file)'}`);
      refresh = true;
    } else if (kind === 'commit') {
      await openStatus();
    } else if (kind === 'diff') {
      if (!t.isDir && S.env.tortoise) { toast('Diff aperto in TortoiseSVN: ' + t.full); logCmd('TortoiseProc.exe /command:diff /path:"' + t.full + '"'); return; }
      await svn(`diff "${fwd(t.path || '.')}"`, 400);
      let diff = t.isDir ? wcUnder(t.path).filter(f => !f.dir && ['M', 'A', 'D', 'R', 'C'].includes(f.st)).map(f => fileDiffText(f.path)).join('\n') : fileDiffText(t.path);
      if (!diff.trim()) { await prompt(`Nessuna modifica rispetto a BASE:\n${t.full}`); return; }
      if (diff.length > 4000) diff = diff.slice(0, 4000) + '\n... (diff troncato: usa SVN Changes o TortoiseSVN per vederlo per intero)';
      await showText(diff);
    } else if (kind === 'log') {
      await openLog();
    } else if (kind === 'add') {
      const us = wcUnder(t.path).filter(f => f.st === '?');
      await svn(`add --force "${fwd(t.path || '.')}"`, 500);
      if (!us.length) throw new Error(`svn: warning: W150002: '${t.full}' is already under version control`);
      us.forEach(f => svnAdd(f.path));
      await prompt(`Aggiunto a SVN:\n${t.full}`); refresh = true;
    } else if (kind === 'revert') {
      let q;
      if (t.isDir) {
        const ch = wcUnder(t.path).filter(f => f.st !== 'N'), pd = propDirs().filter(d => !t.path || d === t.path || d.startsWith(t.path + '\\'));
        const names = ch.map(f => `${EN_ST[f.st]}  ${f.path}`).concat(pd.map(d => `Modified  ${d}`));
        if (!names.length) { await prompt(`Nessuna modifica da annullare in:\n${t.full}`); return; }
        q = `Annullare le modifiche locali di ${names.length} elementi in\n${t.full}\n\n${names.slice(0, 15).join('\n')}${names.length > 15 ? `\n... e altri ${names.length - 15}` : ''}`;
      } else q = `Annullare le modifiche locali di:\n${t.full}`;
      if (!await confirmBox(q + '\n\nL\'operazione non è reversibile.')) return;
      await svn(`revert --depth infinity "${fwd(t.path || '.')}"`, 500);
      wcUnder(t.path).filter(f => ['M', 'A', 'D', 'C', '!', 'R'].includes(f.st)).forEach(f => svnRevert(f.path));
      propDirs().filter(d => !t.path || d === t.path || d.startsWith(t.path + '\\')).forEach(d => svnRevert(d));
      await prompt(`Revert completato:\n${t.full}`); refresh = true;
    } else if (kind === 'ign') {
      if (!t.path) throw new Error("svn: E155007: la radice della working copy non si può ignorare (serve la cartella padre)");
      await svn('propset svn:ignore', 400); svnIgnore(t.path);
      await prompt(`Aggiunto a svn:ignore:\n${t.full}\n\nLa modifica alla proprietà va committata sulla cartella padre.`); refresh = true;
    }
  } catch (e) { await prompt(`${ERR_TITLE[kind]}:\n${e.message}`); }
  render(); if (refresh && S.ui.statusOpen && S.vm.wcPath) await vmRefresh(undefined, true);
}
