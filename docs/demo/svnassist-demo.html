<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVNAssist - Demo interattiva</title>
<style>
:root{
  --bg0:#181818; --bg1:#1f1f1f; --bg2:#252526; --bg3:#2d2d30; --bg4:#37373d; --bd:#3f3f46; --bd2:#4b4b52;
  --fg:#d4d4d4; --fg2:#9d9d9d; --fg3:#6e6e6e; --acc:#0e70c0; --acc2:#1c97ea; --acc-bg:#04395e;
  --ok:#4ec9b0; --warn:#e5b84b; --err:#f48771; --pur:#b180d7;
  --st-M:#1e90ff; --st-A:#3fb950; --st-D:#dc143c; --st-C:#ff4040; --st-U:#8a9bab; --st-X:#ff8c00; --st-R:#9370db;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif; --mono:Consolas,"Cascadia Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg0);color:var(--fg);font:13px/1.4 var(--font);overflow:hidden;display:flex;flex-direction:column;height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
[hidden]{display:none!important}
.btn{background:var(--bg4);border:1px solid var(--bd2);border-radius:2px;padding:3px 10px;color:var(--fg)}
.btn:hover:not(:disabled){background:#45454c;border-color:var(--acc2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--acc2)}
.btn.sm{padding:1px 7px;font-size:11px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--bg4);border-color:var(--bd2)}
input[type=text],input[type=number],textarea,select{background:var(--bg1);border:1px solid var(--bd2);border-radius:2px;padding:3px 6px;width:100%}
textarea{resize:vertical;font-family:var(--font)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--fg3);border-top-color:var(--acc2);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:9px;background:#5a3d00;color:#ffd27a;border:1px solid #8a6100;white-space:nowrap}
.tag.soon{background:#3b2a52;color:#d9b8ff;border-color:#6a4a8f}
.tag.info{background:#10324f;color:#9fd0ff;border-color:#1c5a91}
.tag.ok{background:#12372d;color:#8be3c7;border-color:#1d6b55}
.muted{color:var(--fg2)} .small{font-size:11px}

/* ---------- barra superiore della demo ---------- */
.demo-top{min-height:46px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:4px 14px;flex:none;background:#0f0f10;border-bottom:1px solid var(--bd)}
.demo-top h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
.demo-top h1 span{color:var(--acc2)}
.tabs{display:flex;gap:2px}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:12px 12px 10px;color:var(--fg2)}
.tabs button[aria-selected=true]{color:#fff;border-bottom-color:var(--acc2)}
.tabs button:hover{color:#fff}
.demo-top .sp{flex:1}
#page{flex:1;min-height:0;position:relative}
.view{height:100%}
.sim{display:flex;height:100%}
.vs{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg1)}
.sim-panel{width:330px;flex:none;background:var(--bg2);border-left:1px solid var(--bd);overflow:auto;padding:10px 12px 40px}
body.panel-closed .sim-panel{display:none}
@media (max-width:1250px){
  .sim-panel{position:absolute;right:0;top:0;bottom:0;z-index:40;box-shadow:-8px 0 24px #000a}
}

/* ---------- Visual Studio mock ---------- */
.vs-title{height:30px;display:flex;align-items:center;background:var(--bg0);border-bottom:1px solid var(--bd);padding-left:8px;gap:2px;position:relative}
.vs-logo{width:18px;height:18px;margin-right:6px;background:linear-gradient(135deg,#8661c5,#5c2d91);border-radius:3px;color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center}
.menubar{display:flex;gap:0}
.menubar>div{position:relative}
.menubar>div>button{background:transparent;border:0;padding:5px 9px;font-size:12.5px}
.menubar>div>button:hover,.menubar>div>button[aria-expanded=true]{background:var(--bg4)}
.vs-title .sp{flex:1}
.vs-title .sol-name{color:var(--fg2);font-size:12px;margin-right:14px}
.dd{position:absolute;top:100%;left:0;min-width:230px;background:var(--bg3);border:1px solid var(--bd2);box-shadow:0 6px 18px #000a;padding:3px 0;z-index:60}
.dd button,.ctx button{display:flex;width:100%;justify-content:space-between;gap:20px;background:transparent;border:0;text-align:left;padding:4px 22px 4px 18px;font-size:12.5px;white-space:nowrap}
.dd button:hover:not(:disabled),.ctx button:hover:not(:disabled){background:var(--acc-bg)}
.dd button:disabled,.ctx button:disabled{color:var(--fg3);cursor:default}
.dd hr,.ctx hr{border:0;border-top:1px solid var(--bd);margin:3px 0}
.dd .sub{position:relative}
.dd .sub>.dd{left:100%;top:-4px}
.dd kbd{color:var(--fg3);font-family:inherit;font-size:11px}
.vs-body{flex:1;display:flex;min-height:0}
.se{width:230px;flex:none;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.pane-h{background:var(--bg3);padding:5px 8px;font-size:11.5px;text-transform:none;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);min-height:27px}
.se-tree{flex:1;overflow:auto;padding:4px 0}
.se-empty{padding:16px 12px;color:var(--fg2)}
.node{display:flex;align-items:center;gap:5px;padding:2px 6px;cursor:default;white-space:nowrap;border:0;background:transparent;width:100%;text-align:left;font-size:12.5px}
.node:hover{background:var(--bg4)}
.node.sel{background:var(--acc-bg)}
.node .ic{width:14px;text-align:center;color:var(--fg2);font-size:11px;flex:none}
.node .cs{color:#68b36b}.node .cfg{color:#9aa}.node .fld{color:#dcb67a}
.center{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg1)}
.doc-tabs{display:flex;background:var(--bg0);border-bottom:1px solid var(--bd);min-height:30px;overflow:hidden}
.doc-tabs button{background:transparent;border:0;border-right:1px solid var(--bd);padding:6px 12px;color:var(--fg2);font-size:12.5px;white-space:nowrap}
.doc-tabs button[aria-selected=true]{background:var(--bg1);color:#fff;border-top:2px solid var(--acc2);padding-top:4px}
.doc-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.editor{flex:1;display:flex;min-height:0}
.gutter{background:var(--bg1);color:var(--fg3);font:12px/1.5 var(--mono);text-align:right;padding:8px 8px 8px 12px;user-select:none;overflow:hidden;white-space:pre}
.editor textarea{flex:1;border:0;border-radius:0;background:var(--bg1);font:12px/1.5 var(--mono);padding:8px;resize:none;white-space:pre;overflow:auto;width:auto}
.ed-bar{display:flex;align-items:center;gap:10px;padding:4px 10px;background:var(--bg2);border-top:1px solid var(--bd);font-size:11.5px;color:var(--fg2)}
.welcome{margin:auto;max-width:430px;text-align:center;color:var(--fg2);padding:20px}
.welcome h2{color:var(--fg);font-weight:400;margin:0 0 8px}
.dock{width:470px;flex:none;background:var(--bg2);border-left:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.dock-tabs{display:flex;background:var(--bg3);border-bottom:1px solid var(--bd)}
.dock-tabs button{background:transparent;border:0;padding:5px 12px;color:var(--fg2);font-size:12px;border-top:2px solid transparent}
.dock-tabs button[aria-selected=true]{color:#fff;background:var(--bg2);border-top-color:var(--acc2)}
.dock-tabs .x{padding:5px 7px;margin-left:-8px;color:var(--fg3)}
.dock-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.dock-empty{margin:auto;padding:20px;text-align:center;color:var(--fg2)}
.vs-status{height:23px;background:#68217a;color:#fff;display:flex;align-items:center;padding:0 10px;font-size:12px;gap:16px}
.vs-status.err{background:#a1260d}
.vs-status .sp{flex:1}
@media (max-width:1100px){.se{width:170px}.dock{width:400px}}

/* ---------- tool window: SVN Changes ---------- */
.tw{display:flex;flex-direction:column;height:100%;padding:6px 8px;gap:4px;min-height:0;overflow-y:auto}
.tw .row{display:flex;align-items:center;gap:6px}
.tw hr{border:0;border-top:1px solid var(--bd);margin:3px 0;width:100%}
.branch{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#commitMsg{min-height:54px;max-height:110px}
.ai-status{font-size:11px;color:var(--fg2)}
.trace{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11px;margin-top:2px}
.chip{padding:1px 7px;border-radius:9px;border:1px solid var(--bd2);background:var(--bg3);white-space:nowrap}
.chip.ok{border-color:#1d6b55;background:#12372d;color:#8be3c7}
.chip.fail{border-color:#8a3a2a;background:#3d1d17;color:#ffb3a3}
.chip.skip{color:var(--fg3);border-style:dashed}
.chip.run{border-color:#1c5a91;background:#10324f;color:#9fd0ff}
.pbar{height:8px;background:var(--bg1);border:1px solid var(--bd2);border-radius:4px;overflow:hidden;margin:3px 0}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0}
.dl{background:var(--bg3);border:1px solid var(--bd2);padding:6px 8px;border-radius:3px;font-size:11.5px}
.list-h{display:flex;align-items:center;gap:6px;justify-content:space-between}
.flist{flex:1 1 150px;min-height:150px;overflow:auto;background:var(--bg1);border:1px solid var(--bd)}
.frow{display:grid;grid-template-columns:auto 20px 88px 1fr auto;align-items:center;gap:6px;padding:2px 6px}
.frow:hover{background:var(--bg3)}
.frow .st{font:700 12px var(--mono);text-align:center}
.frow .pth{background:transparent;border:0;text-align:left;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--fg)}
.frow .act{font-size:12px;color:var(--fg2)}
.frow.ctxed{background:var(--acc-bg)}
.grow{display:flex;align-items:center;gap:5px;padding:2px 6px;min-height:25px;white-space:nowrap}
.grow:hover{background:var(--bg3)} .grow.cur{background:var(--acc-bg)}
.grow input[type=checkbox]{margin:0;flex:none}
.grow .chev{width:16px;flex:none;background:transparent;border:0;padding:0;color:var(--fg2);text-align:center;font-size:11px}
.grow .nm{background:transparent;border:0;padding:0;text-align:left;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;color:var(--fg)}
.grow .fill{flex:1 1 0}
.grow .dirp{color:var(--fg3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0;margin-left:2px}
.grow .btn{flex:none}
.srow{background:var(--bg3);font-weight:600;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:1}
.btn[aria-pressed=true]{background:var(--acc-bg);border-color:var(--acc2)}
.langsel{width:auto;padding:1px 4px;font-size:11px}
.empty-list{padding:16px;text-align:center;color:var(--fg2)}
.diffbox{display:flex;flex-direction:column;height:210px;flex:none}
.diffpre{flex:1;margin:0;overflow:auto;background:var(--bg1);border:1px solid var(--bd);font:11.5px/1.45 var(--mono);padding:4px 0;white-space:pre}
.diffpre div{padding:0 8px;min-height:1.45em}
.diffpre .add{background:#12331c;color:#9be5a8}.diffpre .del{background:#3b1519;color:#ffb0ab}.diffpre .hunk{color:#7cb7ff;background:#13263d}.diffpre .meta{color:var(--fg2)}
.tw-status{font-style:italic;color:var(--fg);padding:2px 0 0;font-size:12px}
.tw-status.err{color:var(--err)}
.watch{font-size:10.5px;color:var(--fg3);display:flex;gap:8px;align-items:center}
.watch .dot{width:7px;height:7px;border-radius:50%;background:#3fb950;display:inline-block}
.watch .dot.fire{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.ctx{position:fixed;background:var(--bg3);border:1px solid var(--bd2);box-shadow:0 6px 18px #000a;padding:3px 0;z-index:200;min-width:190px}
/* log */
.logwin{display:flex;flex-direction:column;height:100%;padding:8px 10px;gap:6px;min-height:0}
.logwin .row{display:flex;gap:8px;align-items:center}
.logwin label{white-space:nowrap}
.loglist{flex:1;min-height:100px;overflow:auto;border:1px solid var(--bd);background:var(--bg1)}
.logrow{display:grid;grid-template-columns:60px 100px 130px 1fr;width:100%;background:transparent;border:0;text-align:left;padding:2px 4px;gap:4px;border-bottom:1px solid #2a2a2a}
.logrow:hover{background:var(--bg3)}
.logrow.sel{background:var(--acc-bg)}
.logrow b{font-weight:700}
.logrow .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- sim panel ---------- */
.sim-panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);margin:16px 0 6px;font-weight:600}
.sim-panel h3:first-child{margin-top:0}
.tg{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px;cursor:pointer}
.tg input{width:auto;accent-color:var(--acc2)}
.tg .hint{font-size:10.5px;color:var(--fg3);display:block}
.sim-panel .btn{margin:2px 4px 2px 0}
.cmdlog{background:var(--bg0);border:1px solid var(--bd);height:130px;overflow:auto;font:11px/1.4 var(--mono);padding:5px 7px;color:#b5c7d6;white-space:pre-wrap}
.cmdlog .c{color:#e5c07b}
.note{background:#10324f;border:1px solid #1c5a91;color:#bfe0ff;border-radius:3px;padding:6px 8px;font-size:11.5px;margin:6px 0}
.chain{font-size:11.5px;color:var(--fg2);margin-top:4px}

/* ---------- modali ---------- */
#overlay{position:fixed;inset:0;background:#000a;display:none;z-index:300;align-items:center;justify-content:center;padding:20px}
#overlay.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bd2);box-shadow:0 12px 48px #000d;min-width:360px;max-width:min(680px,96vw);max-height:92vh;display:flex;flex-direction:column}
.modal.wide{width:min(900px,96vw);max-width:96vw}
.m-title{padding:8px 12px;background:var(--bg3);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:12.5px}
.m-body{padding:16px 16px 12px;overflow:auto;white-space:normal}
.m-body.msg{display:flex;gap:14px}
.m-ico{font-size:28px;line-height:1}
.m-body p{margin:0 0 8px;white-space:pre-wrap}
.m-foot{padding:10px 14px;display:flex;justify-content:flex-end;gap:8px;background:var(--bg3);border-top:1px solid var(--bd);flex-wrap:wrap;align-items:center}
.m-foot .l{margin-right:auto}
.banner{background:#3b2a52;color:#e6d0ff;border:1px dashed #8a63b8;padding:5px 10px;font-size:11.5px;text-align:center}
.opt-grid{display:grid;grid-template-columns:200px 1fr;gap:0;min-height:380px}
.opt-tree{background:var(--bg1);border-right:1px solid var(--bd);padding:6px 0;font-size:12.5px}
.opt-tree div{padding:3px 12px;color:var(--fg2)}
.opt-tree .on{background:var(--acc-bg);color:#fff}
.opt-form{padding:10px 14px;overflow:auto;max-height:62vh}
.opt-row{margin-bottom:11px}
.opt-row label{display:block;font-size:12px;margin-bottom:3px}
.opt-row .h{font-size:11px;color:var(--fg3);margin-top:2px}
.opt-row .bad{color:var(--warn)}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:500;align-items:center;pointer-events:none}
.toast{background:#0b3a63;border:1px solid var(--acc2);padding:8px 16px;border-radius:3px;box-shadow:0 4px 16px #000a;animation:fi .2s;max-width:80vw}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.vsix{width:520px}
.vsix .row{display:flex;gap:12px;align-items:center}
.vsix .logo{width:54px;height:54px;border-radius:8px;background:linear-gradient(135deg,#0e70c0,#5c2d91);display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff}

/* ---------- tour ---------- */
#tour{flex:none;background:#12263a;border-top:2px solid var(--acc2);padding:8px 14px 10px;max-height:40vh;overflow:auto;position:relative;z-index:30}
#tour .tcard{display:flex;gap:18px;align-items:flex-start}
#tour .tl{flex:1;min-width:0}
#tour .tr{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:360px}
#tour .th2{display:flex;gap:12px;align-items:center;font-size:12px;color:#9fd0ff;margin-bottom:2px}
#tour h4{margin:0 0 3px;font-size:14px}
#tour p{margin:0 0 5px;font-size:12.5px}
#tour .done{color:var(--ok);font-weight:600}
#tour .hint{background:#0b1b2b;border-left:3px solid var(--acc2);padding:5px 8px;font-size:11.5px;margin:5px 0}
#tour .ptr{font-size:11.5px;color:#ffd24a}
.dots{display:flex;gap:4px}.dots i{width:18px;height:4px;background:#2c4a66;border-radius:2px}.dots i.on{background:var(--acc2)}.dots i.cur{background:#fff}
.tour-target{outline:2px solid #ffd24a!important;outline-offset:2px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{outline-color:#ffd24a00}}
@media (max-width:800px){#tour .tcard{flex-direction:column;gap:6px}#tour .tr{justify-content:flex-start;max-width:none}#tour{max-height:34vh;padding:6px 12px}#tour .btn{padding:2px 8px}.demo-top .btn{padding:2px 8px}}

/* ---------- prerequisiti ---------- */
.prq{flex:none;background:var(--bg3);border:1px solid var(--bd2);padding:6px 8px;max-height:46%;overflow:auto;flex:none}
.prq h5{margin:8px 0 2px;font-size:11px;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
.prow{display:flex;gap:6px;align-items:flex-start;padding:3px 0;border-bottom:1px solid #333}
.prow .pi{width:16px;flex:none;font-weight:700;text-align:center}
.prow .pi.ok{color:var(--ok)}.prow .pi.ko{color:var(--err)}
.prow .pn{flex:1;min-width:0;font-size:12px}
.prow .pb{display:flex;gap:4px;flex-wrap:wrap}
pre.cmd{background:#0c0c0c;border:1px solid var(--bd);padding:6px 8px;font:12px/1.4 var(--mono);white-space:pre-wrap;word-break:break-all;margin:4px 0}

/* ---------- layout stretto ---------- */
.nv{display:none;gap:3px;margin-left:8px}
.dock{container-type:inline-size}
@container (max-width:420px){.frow{grid-template-columns:auto 18px 1fr auto}.frow .act{display:none}}
.tw .row{flex-wrap:wrap}
.modal{min-width:min(360px,92vw)}
@media (max-width:1000px){
  .nv{display:flex}
  .menubar>div.dummy{display:none}
  .se{display:none;position:absolute;left:0;top:30px;bottom:23px;z-index:50;box-shadow:6px 0 18px #000a;width:230px}
  .vs-body.se-open .se{display:flex}
  .vs-body.v-doc .dock{display:none}
  .vs-body.v-dock .center{display:none}
  .dock{width:100%;border-left:0}
  .vs-title .sol-name{display:none}
}
@media (max-width:700px){.demo-top .tag{display:none}.demo-top h1{font-size:13px}}

/* ---------- prossimamente ---------- */
.soon-wrap{height:100%;overflow:auto;padding:22px 26px 60px;background:var(--bg0)}
.soon-wrap h2{margin:0 0 4px}
.soon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
.card{position:relative;background:var(--bg2);border:1px dashed var(--bd2);padding:14px;border-radius:4px;filter:saturate(.35);opacity:.92}
.card h3{margin:0 0 6px;font-size:14px;color:#cfcfcf}
.card p{margin:0 0 10px;color:var(--fg2);font-size:12.5px}
.card .tag{position:absolute;top:10px;right:10px}
.card ul{margin:0 0 10px;padding-left:18px;color:var(--fg2);font-size:12px}
.blame{font:12px/1.5 var(--mono);width:100%;border-collapse:collapse}
.blame td{padding:0 6px;white-space:pre}
.blame td:nth-child(1){color:var(--fg3)}.blame td:nth-child(2){color:var(--acc2)}.blame td:nth-child(3){color:var(--ok)}
.blame tr:hover{background:var(--bg3)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.three pre{margin:0;background:var(--bg1);border:1px solid var(--bd);padding:6px;font:11.5px/1.45 var(--mono);height:190px;overflow:auto}
.three h5{margin:0 0 3px;font-size:11.5px;color:var(--fg2)}

namespace Acme.Shop.Core.Services
{
    public class OrderService
    {
        private readonly IInventoryService _inventory;

        public OrderService(IInventoryService inventory)
        {
            _inventory = inventory;
        }

        public decimal CalculateTotal(Order order)
        {
            var subtotal = order.Lines.Sum(l => l.Price * l.Quantity);
            if (order.Coupon == null)
                return subtotal;

            // il coupon non puo' mai portare il totale sotto zero
            return Math.Max(0, order.Coupon.Apply(subtotal));
        }
    }

// ---------- diff unificato (LCS sulle righe) ----------
function lcsOps(a, b) {
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { ops.push({ t: ' ', s: a[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: '-', s: a[i++] }); }
    else { ops.push({ t: '+', s: b[j++] }); }
  }
  while (i < n) ops.push({ t: '-', s: a[i++] });
  while (j < m) ops.push({ t: '+', s: b[j++] });
  return ops;
}
function unifiedHunks(a, b, ctx = 3) {
  const ops = lcsOps(a, b), ch = [];
  ops.forEach((o, i) => { if (o.t !== ' ') ch.push(i); });
  if (!ch.length) return '';
  const groups = []; let s = ch[0], e = ch[0];
  for (let k = 1; k < ch.length; k++) { if (ch[k] - e <= 2 * ctx + 1) e = ch[k]; else { groups.push([s, e]); s = e = ch[k]; } }
  groups.push([s, e]);
  const out = [];
  for (const [gs, ge] of groups) {
    const from = Math.max(0, gs - ctx), to = Math.min(ops.length - 1, ge + ctx);
    let os = 0, ns = 0;
    for (let i = 0; i < from; i++) { if (ops[i].t !== '+') os++; if (ops[i].t !== '-') ns++; }
    let oc = 0, nc = 0; const lines = [];
    for (let i = from; i <= to; i++) { const o = ops[i]; if (o.t !== '+') oc++; if (o.t !== '-') nc++; lines.push(o.t + o.s); }
    out.push(`@@ -${oc === 0 ? os : os + 1},${oc} +${nc === 0 ? ns : ns + 1},${nc} @@`, ...lines);
  }
  return out.join('\n');
}
const lines = t => (t == null || t === '' ? [] : t.split('\n'));
function mkDiff(path, a, b, revOld, revNew, ctx = 3) {
  const hunks = unifiedHunks(lines(a), lines(b), ctx);
  if (!hunks) return '';
  const p = fwd(path);
  const o = a == null ? '(nonexistent)' : `(revision ${revOld})`;
  const n = b == null ? '(nonexistent)' : (revNew ? `(revision ${revNew})` : '(working copy)');
  return `Index: ${p}\n${'='.repeat(67)}\n--- ${p}\t${o}\n+++ ${p}\t${n}\n${hunks}\n`;
}

// ---------- livello "svn" simulato ----------
function logCmd(c) { S.cmd.push(c); if (S.cmd.length > 80) S.cmd.shift(); }
async function svn(cmd, ms = 450) {
  logCmd('svn ' + cmd);
  await sleep(ms);
  if (!S.env.svn) throw new Error('Impossibile trovare svn.exe: il sistema non riesce a trovare il file specificato.');
}
function isVersioned(f) { return f.st !== '?'; }
function propDirs() { return Object.keys(S.ign).filter(d => (S.ign[d] || []).join('|') !== (S.ignBase[d] || []).join('|')); }
function statusList() {
  const list = S.files.filter(f => f.st !== 'N').map(f => ({ path: f.path, st: f.st, dir: !!f.dir, prop: false }));
  propDirs().forEach(d => { if (!list.some(x => x.path === d)) list.push({ path: d, st: 'M', dir: true, prop: true }); });
  return list.sort((a, b) => (a.path === '.' ? -1 : b.path === '.' ? 1 : a.path.toLowerCase().localeCompare(b.path.toLowerCase())));
}
const fileBy = p => S.files.find(f => f.path === p);
function propDiff(d) {
  const a = S.ignBase[d] || [], b = S.ign[d] || [];
  const p = fwd(d);
  return `Index: ${p}\n${'='.repeat(67)}\n--- ${p}\t(revision ${S.wcRev})\n+++ ${p}\t(working copy)\n\nProperty changes on: ${p}\n${'_'.repeat(67)}\nModified: svn:ignore\n## -${a.length === 0 ? 0 : 1},${a.length} +${b.length === 0 ? 0 : 1},${b.length} ##\n` + lcsOps(a, b).map(o => o.t + o.s).join('\n') + '\n';
}

// ---------- modali (stile message box di VS) ----------
const overlay = () => $('#overlay');
const mstack = [];
function modal(o) {
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'modal' + (o.wide ? ' wide' : '');
    el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
    const btns = (o.buttons || [{ label: 'OK', value: true, primary: true }]);
    el.innerHTML = `${o.banner ? `<div class="banner">${o.banner}</div>` : ''}
      <div class="m-title"><span>${esc(o.title || 'SVNAssist')}</span><button class="btn ghost sm" data-m="x" aria-label="Chiudi">&#10005;</button></div>
      <div class="m-body ${o.icon ? 'msg' : ''}">${o.icon ? `<div class="m-ico">${o.icon}</div>` : ''}<div style="flex:1;min-width:0">${o.body || ''}</div></div>
      <div class="m-foot">${o.footLeft ? `<span class="l">${o.footLeft}</span>` : ''}${btns.map((b, i) => `<button class="btn ${b.primary ? 'primary' : ''}" data-m="${i}" ${b.disabled ? 'disabled' : ''}>${esc(b.label)}</button>`).join('')}</div>`;
    const entry = { el, close: null };
    const close = v => {
      const i = mstack.indexOf(entry); if (i >= 0) mstack.splice(i, 1);
      el.remove(); syncModals(); resolve(v);
    };
    entry.close = close;
    entry.cancel = () => close(o.cancel !== undefined ? o.cancel : (btns.length === 1 ? btns[0].value : false));
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-m]'); if (!b) return;
      if (b.dataset.m === 'x') return entry.cancel();
      const btn = btns[+b.dataset.m];
      if (btn.onClick) { const r = btn.onClick(el, close); if (r === false) return; }
      close(btn.value);
    });
    overlay().appendChild(el); mstack.push(entry); syncModals();
    if (o.onOpen) o.onOpen(el, close);
    const f = el.querySelector('.btn.primary') || el.querySelector('input,textarea,select,button[data-m]');
    if (f) f.focus();
  });
}
function syncModals() {
  const ov = overlay();
  ov.classList.toggle('on', mstack.length > 0);
  mstack.forEach((m, i) => m.el.style.display = i === mstack.length - 1 ? '' : 'none');
}
const prompt = (text, kind = 'ok', title) => modal({
  title: title || 'SVNAssist', icon: kind === 'okcancel' ? '&#10067;' : '&#8505;&#65039;', body: `<p>${esc(text)}</p>`,
  buttons: kind === 'okcancel' ? [{ label: 'OK', value: true, primary: true }, { label: 'Annulla', value: false }] : [{ label: 'OK', value: true, primary: true }],
  cancel: kind === 'okcancel' ? false : true,
});
function toast(msg, ms = 3200) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), ms);
}

// ---------- prima verifica svn.exe (SvnSetupAssistant) ----------
async function ensureSvn() {
  if (S.env.svn) return true;
  if (S.sess.svnPrompted) return false;
  S.sess.svnPrompted = true;
  const ok = await prompt('SVNAssist non ha trovato il client a riga di comando di Subversion (svn.exe) sul sistema.\n\nÈ necessario per tutte le operazioni SVN. Vuoi installarlo ora?', 'okcancel');
  S.f.svnPromptDone = true; S.f.svnPromptChoice = ok ? 'ok' : 'cancel';
  if (!ok) { render(); return false; }
  if (S.env.winget) {
    const lines = ['> winget install --id Slik.Subversion -e --accept-package-agreements --accept-source-agreements', 'Trovato Subversion [Slik.Subversion] Versione 1.14.2', 'Download in corso: https://sliksvn.com/pub/Slik-Subversion-1.14.2-x64.msi', '  ██████████████████████████████  5.8 MB / 5.8 MB', 'Hash del programma di installazione verificato', 'Avvio dell\'installazione del pacchetto...', 'Installazione completata'];
    let box;
    const done = modal({ title: 'winget', wide: false, body: '<pre id="wg" style="margin:0;background:#0c0c0c;border:1px solid var(--bd);padding:8px;min-height:150px;font:11.5px/1.5 var(--mono);white-space:pre-wrap"></pre>', buttons: [{ label: 'Chiudi', value: true, primary: true, disabled: true }], onOpen: el => { box = el; } });
    await sleep(100);
    const pre = box.querySelector('#wg');
    for (const l of lines) { pre.textContent += l + '\n'; await sleep(650); }
    S.env.svn = true; logCmd('[winget] svn.exe installato');
    box.querySelector('[data-m="0"]').disabled = false; box.querySelector('[data-m="0"]').focus();
    await done;
  } else {
    toast('winget non disponibile: apertura di https://sliksvn.com/download/ nel browser', 4500);
  }
  await prompt('Una volta completata l\'installazione di SVN, riavvia Visual Studio (o riapri il pannello SVN) per usare SVNAssist.');
  render();
  return false;
}

// ---------- catena provider AI (AiServiceFactory) ----------
const isGhModels = e => { try { const u = new URL(e); return u.protocol === 'https:' && u.hostname.toLowerCase() === 'models.github.ai'; } catch (e2) { return false; } };
function resolveChain() {
  const st = S.settings, p = (st.aiprovider || '').trim().toLowerCase();
  const use = n => p === n || p === 'auto' || p === '';
  const all = [], c = [];
  // Copilot
  if (p === 'copilot' || (use('copilot') && S.env.copilotRuntime)) {
    if (S.env.gh || p === 'copilot') { c.push({ k: 'copilot', name: 'Copilot' }); all.push({ k: 'copilot', name: 'Copilot', ok: true }); }
  } else if (use('copilot')) all.push({ k: 'copilot', name: 'Copilot', ok: false, why: 'runtime non scaricato (in auto non parte il download)' });
  if (use('claudecode')) { if (S.env.claudeInstalled) { c.push({ k: 'claudecode', name: 'Claude Code' }); all.push({ k: 'claudecode', name: 'Claude Code', ok: true }); } else all.push({ k: 'claudecode', name: 'Claude Code', ok: false, why: 'claude.exe non trovato' }); }
  if (use('claude')) { if (st.anthropicapikey.trim() || S.env.anthropicKey) { c.push({ k: 'claude', name: 'Claude API' }); all.push({ k: 'claude', name: 'Claude API', ok: true }); } else all.push({ k: 'claude', name: 'Claude API', ok: false, why: 'nessuna API key' }); }
  if (use('openai')) {
    let key = st.aiapikey.trim(), viaGh = false;
    if (!key && isGhModels(st.aiendpoint) && S.env.gh) { key = 'gh'; viaGh = true; }
    if (key) { c.push({ k: 'openai', name: 'OpenAI-compatibile', viaGh }); all.push({ k: 'openai', name: 'OpenAI-compatibile', ok: true }); }
    else all.push({ k: 'openai', name: 'OpenAI-compatibile', ok: false, why: 'nessuna key' + (!isGhModels(st.aiendpoint) ? ' (token GitHub NON inviato a un endpoint non GitHub)' : '') });
  }
  return { chain: c, all, auto: p === 'auto' || p === '' };
}
async function downloadCopilot(setDl) {
  setDl({ pct: 0, label: 'Download di SHA256SUMS.txt dalla release GitHub...' }); await sleep(600);
  for (let i = 0; i <= 25; i++) { const pct = i * 4; setDl({ pct, label: `Download github-copilot-<versione>-win32-x64.tgz: ${pct} / 100 MB` }); await sleep(110); }
  setDl({ pct: 100, label: 'Verifica SHA-256 del file scaricato...' }); await sleep(900);
  setDl({ pct: 100, label: 'Hash corretto. Estrazione in %LOCALAPPDATA%\\SVNAssist\\copilot-runtime...' }); await sleep(900);
  setDl({ pct: 100, label: 'Pulizia parti inutilizzate (~250 MB su disco)...' }); await sleep(500);
  S.env.copilotRuntime = true; logCmd('[copilot] runtime installato');
  setDl(null);

// ---------- generazione messaggi (simulata, derivata dalle modifiche vere) ----------
function langOf(l) { l = (l || 'auto').toLowerCase(); return l === 'english' ? 'en' : 'it'; }
const VERB = { it: { A: 'Aggiunge', M: 'Aggiorna', D: 'Rimuove', R: 'Riscrive', C: 'Risolve il conflitto in' }, en: { A: 'Add', M: 'Update', D: 'Remove', R: 'Rewrite', C: 'Resolve conflict in' } };
function changedForAi() {
  const sel = new Set(S.vm.files.filter(x => x.sel).map(x => x.path));
  const fs = S.files.filter(f => ['A', 'M', 'D', 'R', 'C'].includes(f.st) && !f.dir && sel.has(f.path));
  const pr = { A: 0, R: 1, M: 2, C: 3, D: 4 };
  return fs.sort((a, b) => pr[a.st] - pr[b.st]);
}
function descOf(f, l) { return (l === 'en' ? f.en : f.it) || base(f.path); }
function genMessage(lang) {
  const l = langOf(lang), fs = changedForAi();
  if (!fs.length) return l === 'en' ? 'Update configuration' : 'Aggiorna la configurazione';
  const v = VERB[l], and = l === 'en' ? ' and ' : ' e ';
  const cl = f => `${v[f.st]} ${descOf(f, l)}`;
  let title = cl(fs[0]);
  if (fs[1]) { const t2 = title + and + cl(fs[1]).replace(/^(\S+)/, m => m.toLowerCase()); if (t2.length <= 72) title = t2; }
  const body = fs.slice(0, 6).map(f => `- ${v[f.st]} ${base(f.path)}: ${descOf(f, l)}`).join('\n');
  return title + '\n\n' + body;
}
function improveMessage(draft, lang) {
  const l = langOf(lang); let ls = draft.trim().split('\n');
  let t = ls[0].trim().replace(/[.\s]+$/, '');
  const map = l === 'en' ? [[/^fix(ed)?\b/i, 'Fix'], [/^add(ed)?\b/i, 'Add'], [/^updat(ed|e)\b/i, 'Update']] : [[/^fix(ed)?\b/i, 'Corregge'], [/^(added|aggiunto|aggiunta)\b/i, 'Aggiunge'], [/^(updated|aggiornato|aggiornata)\b/i, 'Aggiorna']];
  for (const [re, r] of map) if (re.test(t)) { t = t.replace(re, r); break; }
  t = t.charAt(0).toUpperCase() + t.slice(1);
  let extra = '';
  if (t.length > 72) { const cut = t.lastIndexOf(' ', 69); extra = t.slice(cut + 1); t = t.slice(0, cut) + '...'; }
  let body = ls.slice(1).map(x => x.trim()).filter(Boolean).map(x => x.startsWith('-') ? x : '- ' + x);
  if (extra) body.unshift('- ...' + extra);
  if (!body.length) { const v = VERB[l]; body = changedForAi().slice(0, 4).map(f => `- ${v[f.st]} ${base(f.path)}`); }
  return t + (body.length ? '\n\n' + body.join('\n') : '');
}

// ---------- esecuzione AI condivisa (tool window + dialog) ----------
async function aiCore(kind, ui) {
  const r = resolveChain();
  if (!r.chain.length) {
    ui.status(ui.noProv); ui.trace([]); S.f.aiNone = true;
    if (!S.sess.aiPrompted) {
      S.sess.aiPrompted = true; S.f.aiPromptShown = true;
      const ok = await prompt("Nessun provider AI trovato per generare i commit. Basta UNA di queste opzioni:\n\n• GitHub Copilot o GitHub CLI: esegui 'gh auth login'\n• Claude: installa Claude Code e fai login, oppure inserisci una Anthropic API Key\n• Gratis: crea un token GitHub e incollalo in Tools > Options > SVNAssist > AI API Key\n\nVuoi aprire la pagina per creare il token GitHub gratuito?", 'okcancel');
      if (ok) toast('Apertura nel browser: https://github.com/settings/tokens/new?description=SVNAssist&scopes=', 4500);
    }
    render(); return;
  }
  if (!S.vm.wcPath) { ui.status('Nessuna working copy configurata.'); return; }
  const selPaths = S.vm.files.filter(f => f.sel && !f.dir && ['M', 'A', 'D', 'R', 'C'].includes(f.st)).map(f => f.path);
  if (!selPaths.length) { ui.status('Seleziona almeno un file da analizzare'); return; }
  if (kind === 'improve' && !ui.draft().trim()) { ui.status(ui.noDraft); return; }
  ui.busy(true);
  const trace = r.auto ? r.all.map(a => ({ name: a.name, k: a.k, state: a.ok ? 'wait' : 'skip', detail: a.ok ? '' : a.why })) : r.chain.map(a => ({ name: a.name, k: a.k, state: 'wait', detail: '' }));
  ui.trace(trace);
  try {
    ui.status(kind === 'improve' ? ui.improving : ui.generating);
    let diff;
    await svn('diff -x "-U 0 -p" --no-diff-deleted ' + selPaths.map(p => '"' + fwd(p) + '"').join(' '), 500); diff = selPaths.map(p => fileDiffText(p, 0)).filter(Boolean).join('\n').trim();
    if (!diff.trim() && !S.env.bigDiff) { ui.status(ui.noDiff); ui.trace([]); return; }
    const size = S.env.bigDiff ? 54000 : diff.length;
    if (size > 28000 - 1000) {
      const n = Math.ceil(size / 12000);
      for (let i = 1; i <= n; i++) { ui.status(`Diff grande (${Math.round(size / 1000)} KB): riassunto blocco ${i}/${n}...`); await sleep(450); }
    }
    const errors = []; let result = null, first = true;
    for (const c of r.chain) {
      const t = trace.find(x => x.k === c.k); t.state = 'run'; ui.trace(trace);
      try {
        if (S.env.failFirst && first) { await sleep(800); throw new Error(c.k === 'claude' ? 'Anthropic API 529: overloaded_error' : 'AI API error 429 TooManyRequests: rate limit exceeded'); }
        if (c.k === 'copilot') {
          if (!S.env.copilotRuntime) await downloadCopilot(d => ui.dl(d));
          if (!S.env.gh) throw new Error("Sessione Copilot non autenticata: esegui 'gh auth login'");
        } else if (c.k === 'claudecode') {
          await sleep(500);
          if (!S.env.claudeLogin) throw new Error('Claude Code fallito (exit code 1): Not logged in - Please run /login');
        }
        await sleep(1000);
        result = kind === 'improve' ? improveMessage(ui.draft(), ui.lang()) : genMessage(ui.lang());
        t.state = 'ok'; ui.trace(trace); break;
      } catch (e) { t.state = 'fail'; t.detail = e.message; errors.push(`${c.name === 'Copilot' ? 'GitHub Copilot' : c.name}: ${e.message}`); ui.trace(trace); }
      first = false;
    }
    if (result == null) throw new Error(r.chain.length > 1 ? 'Nessun provider AI ha risposto.\n' + errors.join('\n') : errors[0].replace(/^[^:]+: /, ''));
    ui.set(result);

const SEC_NAMES = { conf: 'Conflitti', chg: 'Modifiche', unv: 'Non versionati' };

    const { cur, label } = compact(d), ck = 's:' + sec + ':' + cur.key, exp = !S.vm.collapsed[ck];

    if (exp) flattenTree(cur, depth + 1, sec, out);
  });

}
function folderKeys(node, sec, keys) { [...node.dirs.values()].forEach(d => { const { cur } = compact(d); keys.push('s:' + sec + ':' + cur.key); folderKeys(cur, sec, keys); }); }
function allFolderKeys() { const k = []; ['conf', 'chg', 'unv'].forEach(s => folderKeys(buildTree(secItems(s)), s, k)); return k; }
function selState(items) { const n = items.filter(f => f.sel).length; return n === 0 ? 0 : n === items.length ? 2 : 1; }
function chk(act, arg, items, label) { const s = selState(items); return `<input type="checkbox" data-act="${act}" data-arg="${esc(arg)}" ${s === 2 ? 'checked' : ''} ${s === 1 ? 'data-indet="1"' : ''} aria-label="${esc(label)}">`; }

const parseArg = a => { const i = a.indexOf('|'); return [a.slice(0, i), a.slice(i + 1)]; };
async function folderOp(kind, arg) {
  const vm = S.vm, [sec, key] = parseArg(arg), items = under(secItems(sec), key), where = key || SEC_NAMES[sec];

    } else if (kind === 'rev') {

      if (!go) return;
      vm.statusMsg = 'Revert in corso...'; render(); await svn('revert -R', 500); t.forEach(f => svnRevert(f.path)); await done(`Revert completato su ${t.length} elementi.`);
    } else if (kind === 'ign') {
      if (!key || !items.length || items.some(f => f.st !== '?')) { vm.statusMsg = 'Add to Ignore List è disponibile solo per elementi unversioned.'; return render(); }
      vm.statusMsg = 'Aggiornamento ignore list in corso...'; render(); await svn('propset svn:ignore', 400); svnIgnore(key); await done(`Aggiunto alla ignore list: ${key}`);
    } else if (kind === 'diff') {
      const t = items.filter(f => !f.dir && ['M', 'A', 'D', 'R', 'C'].includes(f.st));
      if (S.env.tortoise && t.length) { vm.statusMsg = `Diff aperto in TortoiseSVN: ${where}`; toast('Diff aperto in TortoiseSVN: ' + where); return render(); }
      vm.diffTitle = `Diff cartella: ${where}`; vm.diffContent = 'Caricamento diff...'; vm.diffVisible = true; render(); await svn('diff "' + fwd(key || '.') + '"', 400);

const wcUnder = path => S.files.filter(f => !path || f.path === path || f.path.startsWith(path + '\\'));
const REVERTABLE = ['M', 'A', 'D', 'C', '!', 'R'];
async function confirmList(title, text, rows, okLabel) {
  return modal({
    title, icon: '&#9888;&#65039;', cancel: false,
    body: `<p>${esc(text)}</p><div class="flist" style="max-height:150px;min-height:0;margin:6px 0">${rows.slice(0, 15).map(r => `<div style="padding:1px 6px;font-family:var(--mono);font-size:12px">${esc(r)}</div>`).join('')}${rows.length > 15 ? `<div class="muted small" style="padding:2px 6px">... altri ${rows.length - 15}</div>` : ''}</div><p><span class="tag">Novità in arrivo</span> <span class="small muted">conferma non ancora nella vera estensione.</span></p>`,
    buttons: [{ label: okLabel || 'Sì, procedi', value: true, primary: true }, { label: 'No', value: false }],
  });
}
async function seOp(kind, arg) {
  const i = arg.indexOf('|'), type = arg.slice(0, i), path = arg.slice(i + 1), label = path ? fwd(path) : '(soluzione)';
  if (!S.solution || !S.solution.inWc) { await prompt('Non è una working copy SVN'); return; }
  await ensureSvn(); if (!S.env.svn) return;
  try {
    if (kind === 'update') {
      await svn(`update "${label}"`, 900); svnUpdate();
      const nc = S.files.filter(f => f.st === 'C').length;
      render(); toast(`Aggiornato alla revisione ${S.headRev}` + (nc ? `: ${nc} file in conflitto` : ''), 4000);
      await prompt(`Aggiornato alla revisione ${S.headRev}.\n` + (nc ? `${nc} file in conflitto: risolvili da SVN Changes.` : 'Nessun conflitto.'));
    } else if (kind === 'commit') {
      await openStatus();
      S.vm.files.forEach(f => { f.sel = f.st !== '?' && (!path || f.path === path || f.path.startsWith(path + '\\')); });
      render(); toast('SVN Changes: spuntati i file di ' + label);
    } else if (kind === 'diff') {
      const ts = wcUnder(path).filter(f => !f.dir && ['M', 'A', 'D', 'R', 'C'].includes(f.st));
      if (!ts.length) { await prompt('Nessuna modifica rispetto a BASE.'); return; }
      if (S.env.tortoise) { toast('Diff aperto in TortoiseSVN: ' + label); logCmd('TortoiseProc.exe /command:diff /path:"' + WC + '\\' + path + '"'); return; }
      await openStatus(); await svn(`diff "${label}"`, 300);
      const vm = S.vm; vm.diffTitle = 'Diff con BASE: ' + label; vm.diffContent = ts.map(f => fileDiffText(f.path)).join('\n'); vm.diffVisible = true; vm.statusMsg = `Diff inline caricato: ${label}`; render();
    } else if (kind === 'log') {
      S.ui.logOpen = true; S.ui.active = '__log'; S.ui.view = 'doc'; S.ui.seOpen = false; S.lvm.path = WC; render(); await lvmLoad();
    } else if (kind === 'add') {
      const t = wcUnder(path).filter(f => f.st === '?');
      if (!t.length) { await prompt('Nessun elemento non versionato da aggiungere.'); return; }
      await svn(`add --force "${label}"`, 500); t.forEach(f => svnAdd(f.path)); toast(`Aggiunti a SVN: ${t.length} elementi.`);
    } else if (kind === 'revert') {
      const t = wcUnder(path).filter(f => REVERTABLE.includes(f.st)), pd = propDirs().filter(d => !path || d === path || d.startsWith(path + '\\'));
      const rows = t.map(f => `${f.st} ${f.path}`).concat(pd.map(d => `M ${d} (proprietà svn:ignore)`));
      if (!rows.length) { await prompt('Nessuna modifica da annullare.'); return; }
      if (!await confirmList('SVN Revert', `Annullare le modifiche locali di ${rows.length} elementi in ${label}? L'operazione non può essere annullata.`, rows, 'Sì, annulla le modifiche')) return;
      await svn('revert -R "' + label + '"', 500); t.forEach(f => svnRevert(f.path)); pd.forEach(d => svnRevert(d)); toast(`Revert completato su ${rows.length} elementi.`);
    } else if (kind === 'ign') {
      const t = wcUnder(path);
      if (type === 'solution' || type === 'project' || !t.length || t.some(f => f.st !== '?')) { await prompt('Add to Ignore List è disponibile solo per elementi unversioned.'); return; }
      await svn('propset svn:ignore', 400); svnIgnore(path); toast('Aggiunto alla ignore list: ' + label);
    }
  } catch (e) { await prompt('Errore: ' + e.message); }
  render(); if (S.ui.statusOpen && S.vm.wcPath && kind !== 'diff') { const m = S.vm.statusMsg; await vmRefresh(); if (kind === 'commit') S.vm.statusMsg = m; render(); }
}

    onOpen: el => { elRef = el; draw(); },
  });
}

  toggleFile: (a, el) => { const f = S.vm.files.find(x => x.path === a); if (f) f.sel = el.checked; render(); },
  toggleGroup: (a, el) => { setGroup(a, el.checked); render(); },
  toggleSec: a => { S.vm.collapsed['sec:' + a] = !S.vm.collapsed['sec:' + a]; render(); },
  toggleFolder: a => { S.vm.collapsed[a] = !S.vm.collapsed[a]; render(); },
  expandAll: () => { S.vm.collapsed = {}; render(); },
  collapseAll: () => { allFolderKeys().forEach(k => S.vm.collapsed[k] = true); render(); },
  setView: a => { S.vm.view = a; render(); },
  selRow: (a, el) => { S.vm.cur = a; $$('.grow.cur').forEach(x => x.classList.remove('cur')); const r = el.closest('.grow'); if (r) r.classList.add('cur'); },
  folderOp: (a, el) => { if (el.dataset.arg2 !== undefined && el.dataset.arg2 !== '') { closeCtx(); folderOp(a, el.dataset.arg2); } },
  showDiff: a => vmShowDiff(a), closeDiff: () => { S.vm.diffVisible = false; S.vm.diffContent = ''; S.vm.diffTitle = ''; render(); },
  commitDialog: () => commitDialog(),
  ctxop: (a, el) => { closeCtx(); vmOp(a, el.dataset.arg2); },
  logLoad: () => lvmLoad(), logSel: a => lvmSelect(+a),
  logUseWc: () => { S.lvm.path = WC; render(); },
  env: (a, el) => { S.env[a] = el.checked; if (a === 'gh' && el.checked) S.env.ghInstalled = true; if (a === 'ghInstalled' && !el.checked) S.env.gh = false; render(); },
  simChange: () => simulateChange(),
  restart: () => restartVS(),
  branchSel: (a, el) => { S.branch = el.value; if (S.vm.wcPath) vmRefresh(); render(); },
  soon: a => SOON[a](),
  langSel: (a, el) => { S.vm.lang = el.value; render(); },
  prereqRecheck: a => prereqRecheck(a),
  seSub: (a, el) => { const r = el.getBoundingClientRect(); ctxMenu(r.right - 4, r.top, [{ label: 'SVN Update', act: 'seOp', arg: 'update', arg2: a }, { label: 'SVN Commit...', act: 'seOp', arg: 'commit', arg2: a }, { label: 'Diff con BASE', act: 'seOp', arg: 'diff', arg2: a }, { label: 'Mostra log', act: 'seOp', arg: 'log', arg2: a }, '-', { label: 'SVN Add', act: 'seOp', arg: 'add', arg2: a }, { label: 'SVN Revert', act: 'seOp', arg: 'rev'.replace('rev', 'revert'), arg2: a }, { label: 'Aggiungi a ignore list', act: 'seOp', arg: 'ign', arg2: a }], true); },
  seOp: (a, el) => { closeCtx(); seOp(a, el.dataset.arg2); },
  sectx: (a, el) => { closeCtx(); toast('Anteprima: "' + el.textContent + '" — non ancora implementato'); },
};
document.addEventListener('click', e => {
  const inCtx = e.target.closest('.ctx'); if (!inCtx) closeCtx();
  if (!e.target.closest('.menubar') && S.ui.menu) { S.ui.menu = null; S.ui.sub = false; render(); }
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return;
  if (el.tagName === 'A') e.preventDefault();
  const fn = ACT[el.dataset.act]; if (fn) { if (el.dataset.act === 'closeTab') e.stopPropagation(); fn(el.dataset.arg, el, e); }
});
document.addEventListener('change', e => { const el = e.target; if (el.tagName === 'SELECT' && el.dataset.act) ACT[el.dataset.act](el.dataset.arg, el, e); });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'edtext') { const f = S.ui.active; S.ui.buf[f] = el.value; const g = $('#gut'); if (g) g.textContent = Array.from({ length: el.value.split('\n').length }, (_, i) => i + 1).join('\n'); return; }
  const m = el.dataset && el.dataset.model; if (!m) return;
  const [o, k] = m.split('.'); S[o][k] = el.type === 'number' ? (+el.value || 0) : el.value;
});
document.addEventListener('dblclick', e => { const r = e.target.closest('[data-ctxitem]'); if (r && !e.target.closest('input,.btn')) vmShowDiff(r.dataset.ctxitem); });
document.addEventListener('contextmenu', e => {
  const fo = e.target.closest('[data-ctxfolder]');
  if (fo) {
    e.preventDefault(); const arg = fo.dataset.ctxfolder, [sec, key] = parseArg(arg), its = under(secItems(sec), key);
    return ctxMenu(e.clientX, e.clientY, [{ label: 'SVN Add (contenuto non versionato)', act: 'folderOp', arg: 'add', arg2: arg, off: !its.some(f => f.st === '?') }, { label: 'SVN Revert cartella', act: 'folderOp', arg: 'rev', arg2: arg, off: !its.some(f => f.canRev) }, { label: 'Aggiungi a ignore list', act: 'folderOp', arg: 'ign', arg2: arg, off: !(its.length && its.every(f => f.st === '?')) }, { label: 'Diff cartella', act: 'folderOp', arg: 'diff', arg2: arg, off: !its.some(f => !f.dir && ['M', 'A', 'D', 'R', 'C'].includes(f.st)) }, '-', { label: 'Comprimi tutto', act: 'collapseAll' }, { label: 'Espandi tutto', act: 'expandAll' }]);
  }
  const sc = e.target.closest('[data-ctxsec]');
  if (sc) {
    e.preventDefault(); const sec = sc.dataset.ctxsec, arg = sec + '|';
    return ctxMenu(e.clientX, e.clientY, sec === 'unv' ? [{ label: 'Aggiungi tutti', act: 'folderOp', arg: 'add', arg2: arg }] : sec === 'chg' ? [{ label: 'Revert tutto', act: 'folderOp', arg: 'rev', arg2: arg }] : [{ label: 'Nessuna azione per i conflitti', act: 'sectx', off: true }]);
  }
  const row = e.target.closest('[data-ctxitem]');
  if (row) {
    e.preventDefault(); const it = S.vm.files.find(f => f.path === row.dataset.ctxitem); if (!it) return; const p = it.path;
    return ctxMenu(e.clientX, e.clientY, [{ label: 'SVN Add', act: 'ctxop', arg: 'add', arg2: p, off: !it.canAdd }, { label: 'Add to Ignore List', act: 'ctxop', arg: 'ign', arg2: p, off: !it.canIgn }, { label: 'SVN Delete', act: 'ctxop', arg: 'del', arg2: p, off: !it.canDel }, { label: 'SVN Revert', act: 'ctxop', arg: 'rev', arg2: p, off: !it.canRev }, '-', { label: 'Resolve Conflict', act: 'ctxop', arg: 'res', arg2: p, off: !it.canRes }, '-', { label: 'Show Diff', act: 'showDiff', arg: p }]);
  }
  const se = e.target.closest('[data-sectx]');
  if (se) { e.preventDefault(); const t = se.dataset.sectx; return ctxMenu(e.clientX, e.clientY, [...(t.startsWith('file|') ? [{ label: 'Apri', act: 'openFile', arg: t.slice(5) }, '-'] : []), { label: 'Taglia', act: 'sectx', off: true }, { label: 'Elimina', act: 'sectx', off: true }, '-', { label: 'SVN  ▸', act: 'seSub', arg: t }]); }
  const mini = e.target.closest('[data-minictx]');
  if (mini) { e.preventDefault(); ctxMenu(e.clientX, e.clientY, [{ label: 'Apri', act: 'sectx' }, '-', { label: 'SVN Update', act: 'sectx' }, { label: 'SVN Commit...', act: 'sectx' }, { label: 'SVN Diff', act: 'sectx' }, { label: 'SVN Revert', act: 'sectx' }, { label: 'SVN Blame', act: 'sectx' }, { label: 'SVN Log', act: 'sectx' }]); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#ctxhost').firstChild) return closeCtx();
    if (mstack.length) { mstack[mstack.length - 1].cancel(); return; }
    if (S.ui.menu) { S.ui.menu = null; S.ui.sub = false; render(); }
    return;
  }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('nm') && e.target.closest('[data-ctxitem]')) { e.preventDefault(); vmShowDiff(e.target.closest('[data-ctxitem]').dataset.ctxitem); return; }
  if (e.key === 'Tab' && mstack.length) {
    const el = mstack[mstack.length - 1].el, f = $$('button:not(:disabled),input,select,textarea,[contenteditable]', el); if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && e.target.id === 'edtext') { e.preventDefault(); saveFile(S.ui.active); }
});

// ---------- avvio ----------
function startMode(mode, welcome) {
  const panelOpen = S && S.ui ? S.ui.panelOpen : innerWidth >= 1500;
  while (mstack.length) { const m = mstack.pop(); m.el.remove(); } syncModals(); closeCtx();
  S = freshState(mode); S.ui.panelOpen = panelOpen;
  if (mode === 'first') S.tour = { on: true, step: 0 };
  render();
  if (welcome) showWelcome();
}
async function showWelcome() {
  const r = await modal({
    title: 'SVNAssist - demo interattiva', cancel: 'free', wide: false, body: `<p><b>Benvenuto.</b> Questa pagina simula Visual Studio con l'estensione SVNAssist: nulla è reale, tutto vive in memoria nel browser.</p>
    <p>Puoi seguire il <b>tour di primo utilizzo</b> (installazione, svn.exe mancante, configurazione dell'AI, primo commit) oppure esplorare liberamente con tutto già pronto.</p><p class="small muted">Suggerimento: il pulsante "Pannello simulazione" in alto permette di cambiare l'ambiente (svn, TortoiseSVN, provider AI...).</p>`,
    buttons: [{ label: 'Avvia il tour di primo utilizzo', value: 'first', primary: true }, { label: 'Esplora liberamente', value: 'free' }],
  });
  if (r === 'first') startMode('first');
}
S = freshState('free');
startMode('free');
let savedTab = null;
try { savedTab = localStorage.getItem('svnassist-demo-tab'); } catch (e) { }
if (savedTab === 'soon') ACT.tab('soon'); else showWelcome();
</script>
